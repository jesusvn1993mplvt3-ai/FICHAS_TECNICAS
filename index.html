<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escaner TEJEDOR v2 - Cirineo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #000; color: white; touch-action: manipulation; }
        .camera-container-modal { width: 100%; aspect-ratio: 1; overflow: hidden; position: relative; background: black; }
        #reader-modal { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBqHgV4vDat1-VmZfKbiPg7nuiX-ROcexw",
            authDomain: "cirineo-cec21.firebaseapp.com",
            projectId: "cirineo-cec21",
            storageBucket: "cirineo-cec21.firebasestorage.app",
            messagingSenderId: "620210618284",
            appId: "1:620210618284:web:482bab9bf74650fff18409"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const FieldValue = firebase.firestore.FieldValue;

        const Icon = ({ name, size = 24 }) => {
            const ref = useRef(null);
            useEffect(() => { if (ref.current) ref.current.innerHTML = lucide.icons[name]?.toSvg({ width: size, height: size }); }, [name]);
            return <span ref={ref} className="inline-flex"></span>;
        };

        const playBeep = () => {
            try { const ctx = new AudioContext(); const osc = ctx.createOscillator(); osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.1); } catch(e){}
        };

        const ScannerModal = ({ onClose, ordersCache, onSaved }) => {
            const [scans, setScans] = useState([]);
            const [msg, setMsg] = useState('Cámara lista...');
            const [isSaving, setIsSaving] = useState(false);
            const scannerRef = useRef(null);

            useEffect(() => {
                setTimeout(() => {
                    const scanner = new Html5QrcodeScanner("reader-modal", { fps: 5, qrbox: { width: 300, height: 100 }, aspectRatio: 1.0 }, false);
                    scanner.render((text) => handleScan(text), (err) => {});
                    scannerRef.current = scanner;
                }, 100);
                return () => scannerRef.current?.clear().catch(e=>{});
            }, []);

            const handleScan = (raw) => {
                const code = raw.trim().toUpperCase();
                if (scans.some(s => s.code === code)) return;

                // 1. Buscar en órdenes
                let found = null;
                for (const o of ordersCache) {
                    const pkg = o.progreso?.find(p => p.codigoUnico === code);
                    if (pkg) {
                        found = { pkg, order: o, code };
                        break;
                    }
                }

                if (found) {
                    playBeep();
                    setScans(prev => [...prev, found]);
                    setMsg(`Léido: ${found.pkg.piezaNombre}`);
                    if(scannerRef.current) scannerRef.current.pause(true);
                    setTimeout(()=>scannerRef.current?.resume(), 1500);
                } else {
                    setMsg(`NO ENCONTRADO: ${code}`);
                }
            };

            const saveAll = async () => {
                if (isSaving || scans.length === 0) return;
                setIsSaving(true);
                setMsg("Guardando y actualizando rastreo...");

                const batch = db.batch();
                // Agrupamos por Orden para hacer updates masivos a arrays (limitación de Firestore)
                // Para simplificar y evitar condiciones de carrera en arrays complejos, haremos lecturas frescas.
                
                let count = 0;

                for (const item of scans) {
                    // 1. Registro Producción (Nómina/Conteo simple)
                    const prodRef = db.collection('registro_produccion').doc();
                    batch.set(prodRef, {
                        codigo_paquete: item.code,
                        orderId: String(item.order.id),
                        fecha: FieldValue.serverTimestamp(),
                        tejedor: "ESCANER_TEJEDOR",
                        tipo: "produccion",
                        modelo: item.order.codigo,
                        partida: item.order.partida,
                        tracking_init: true
                    });

                    // 2. Actualización del Rastreo (Lógica Nueva)
                    // Nota: Firestore no deja actualizar un objeto específico dentro de un array fácilmente.
                    // Tenemos que leer la orden, modificar el array en memoria y reescribir la orden.
                    // *En un entorno de alta concurrencia esto se hace con transacciones, aquí lo simplificamos por pasos.*
                    
                    const orderRef = db.collection('orders').doc(String(item.order.id));
                    // Aquí usamos una transacción para asegurar que no sobrescribimos otros escaneos
                    try {
                        await db.runTransaction(async (transaction) => {
                            const sfDoc = await transaction.get(orderRef);
                            if (!sfDoc.exists) throw "Orden no existe";

                            const orderData = sfDoc.data();
                            const newProgreso = orderData.progreso.map(p => {
                                if (p.codigoUnico === item.code) {
                                    // LOGICA DE RASTREO
                                    const history = p.trackingHistory || [];
                                    // Si ya tiene historial de tejedor, no lo duplicamos
                                    if(!history.some(h => h.step === 'TEJEDOR')) {
                                        history.push({
                                            step: 'TEJEDOR',
                                            status: 'GREEN', // Tejedor siempre es Verde (Salida)
                                            timestamp: new Date().toISOString(),
                                            user: 'TEJEDOR_AUTO',
                                            note: 'Salida de tejido'
                                        });
                                    }
                                    
                                    return { 
                                        ...p, 
                                        finished: true, // Legacy
                                        currentStep: 'TEJEDOR', // Nuevo tracker
                                        trackingHistory: history // Nuevo historial
                                    };
                                }
                                return p;
                            });
                            
                            transaction.update(orderRef, { progreso: newProgreso });
                        });
                        count++;
                    } catch (e) {
                        console.error("Error updating order tracking", e);
                    }
                }

                await batch.commit();
                onSaved(count);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black z-50 flex flex-col">
                    <div className="p-4 bg-slate-800 flex justify-between items-center text-white">
                        <h2 className="font-bold flex items-center gap-2"><Icon name="camera"/> ESCANER TEJIDO</h2>
                        <button onClick={onClose} className="text-red-500 font-bold">X</button>
                    </div>
                    <div className="camera-container-modal">
                        <div id="reader-modal"></div>
                        <div className="absolute bottom-2 left-0 w-full text-center text-cyan-400 font-bold bg-black/50 p-1">{msg}</div>
                    </div>
                    <div className="flex-grow bg-slate-900 p-4 overflow-y-auto">
                        {scans.map((s, i) => (
                            <div key={i} className="bg-slate-800 p-2 mb-2 rounded border-l-4 border-cyan-500 text-white flex justify-between">
                                <div>
                                    <div className="font-bold">{s.code}</div>
                                    <div className="text-xs text-slate-400">{s.pkg.piezaNombre}</div>
                                </div>
                                <div className="text-green-400 text-xs font-bold self-center">LISTO</div>
                            </div>
                        ))}
                    </div>
                    <button onClick={saveAll} disabled={isSaving || scans.length===0} className="m-4 bg-cyan-600 p-4 rounded text-white font-bold text-xl disabled:opacity-50">
                        {isSaving ? 'GUARDANDO...' : `CONFIRMAR (${scans.length})`}
                    </button>
                </div>
            );
        };

        const App = () => {
            const [orders, setOrders] = useState([]);
            const [showScanner, setShowScanner] = useState(false);
            const [status, setStatus] = useState("Cargando...");

            useEffect(() => {
                return db.collection('orders').where('status', '!=', 'ARCHIVADO').onSnapshot(s => {
                    setOrders(s.docs.map(d => ({...d.data(), id: d.id})));
                    setStatus(`${s.docs.length} Órdenes activas`);
                });
            }, []);

            return (
                <div className="h-screen bg-slate-950 flex flex-col items-center justify-center text-white p-4">
                    <h1 className="text-2xl font-black mb-2 flex items-center gap-2"><Icon name="scan-barcode"/> TEJEDOR v2</h1>
                    <p className="text-slate-400 mb-8 font-mono text-sm">{status}</p>
                    
                    <button onClick={() => setShowScanner(true)} className="w-full max-w-sm aspect-square bg-slate-800 rounded-3xl border-4 border-cyan-500/50 flex flex-col items-center justify-center gap-4 hover:bg-slate-800/80 active:scale-95 transition shadow-[0_0_50px_rgba(6,182,212,0.3)]">
                        <Icon name="camera" size={64}/>
                        <span className="text-2xl font-bold">ESCANEAR SALIDA</span>
                    </button>

                    {showScanner && <ScannerModal onClose={() => setShowScanner(false)} ordersCache={orders} onSaved={(n) => alert(`Guardados ${n} paquetes con éxito.`)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
