<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Scanner Bros. - Tejedor Joel</title>
    <meta name="description" content="Escáner Gamificado de Producción inspirado en Mario Bros.">

    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/d/d1/Barcode_Scanner_icon.png">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/d/d1/Barcode_Scanner_icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* ESTÉTICA MARIO BROS */
        body { background-color: #0d0d0d; color: white; font-family: 'sans-serif'; touch-action: manipulation; overscroll-behavior: none; }
        #root, .app-container { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
        
        /* Animación de Recoger Moneda/Hongo */
        .flash-mario { 
            animation: flashMarioAnim 0.3s ease-out; 
        }
        @keyframes flashMarioAnim { 
            0% { background-color: rgba(255, 69, 0, 0.5); } 
            50% { background-color: rgba(30, 144, 255, 0.5); } 
            100% { background-color: #0d0d0d; } 
        }

        /* Estilos de Bloque de Ladrillos para el Escáner */
        .camera-container-modal { 
            width: 100%; 
            aspect-ratio: 1; /* Esto ayuda a que el video se vea bien */
            max-height: 45vh; /* Altura máxima del contenedor de video */
            overflow: hidden; 
            position: relative; 
            background: #444; 
            border-top: 5px solid #a0522d; 
            border-bottom: 5px solid #a0522d; 
            flex-shrink: 0;
        }
        #reader-modal { 
            width: 100%; 
            height: 100%; 
        }
        #reader-modal a { display: none !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBqHgV4vDat1-VmZfKbiPg7nuiX-ROcexw",
            authDomain: "cirineo-cec21.firebaseapp.com",
            projectId: "cirineo-cec21",
            storageBucket: "cirineo-cec21.firebasestorage.app",
            messagingSenderId: "620210618284",
            appId: "1:620210618284:web:482bab9bf74650fff18409",
            measurementId: "G-B7YLM78RVW"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const FieldValue = firebase.firestore.FieldValue;

        const Icon = ({ name, size = 24, className, onClick }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && lucide.icons[name]) {
                    ref.current.innerHTML = lucide.icons[name].toSvg({ width: size, height: size, class: className });
                }
            }, [name, className]);
            return <span ref={ref} onClick={onClick} className={`inline-flex items-center justify-center ${onClick ? 'cursor-pointer' : ''}`}></span>;
        };

        // *** FUNCIÓN DE AUDIO MARIO BROS ***
        const playMarioSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                if (type === 'success') {
                    // Moneda/Hongo - Dos tonos ascendentes
                    osc.type = 'square';
                    gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
                    osc.frequency.setValueAtTime(500, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(700, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'error') {
                    // Daño/Game Over - Tono descendente
                    osc.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                } else if (type === 'warning') {
                     // Bloque GOLPEADO/Advertencia
                    osc.type = 'triangle';
                    gainNode.gain.setValueAtTime(0.4, ctx.currentTime);
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                }
            } catch(e) {
                console.error("Audio API error:", e);
            }
        };

        // --- COMPONENTE MODAL DEL ESCÁNER ---
        const QuickScannerModal = ({ isVisible, onClose, ordersCache, onScanSaved }) => {
            const [scans, setScans] = useState([]); 
            const [scanStatus, setScanStatus] = useState({ message: 'Preparando el mundo...', type: 'info' });
            const [isSaving, setIsSaving] = useState(false);
            const scannerRef = useRef(null);
            const SCAN_INTERVAL_MS = 1500; 
            const appContainerRef = useRef(null); 

            // 1. Manejo de la cámara al abrir/cerrar
            useEffect(() => {
                if (isVisible) {
                    setScans([]); 
                    setScanStatus({ message: 'Preparando el mundo...', type: 'info' });
                    
                    setTimeout(() => {
                        const html5QrcodeScanner = new Html5QrcodeScanner(
                            "reader-modal", 
                            { 
                                fps: 5, 
                                // Cuadro de escaneo 6:1 (300px ancho / 50px alto)
                                qrbox: { width: 300, height: 50 }, 
                                aspectRatio: 1.0, 
                                videoConstraints: { facingMode: "environment" } 
                            },
                            false
                        );

                        const onScanSuccess = (decodedText) => {
                            handleQuickScan(decodedText);
                            if (scannerRef.current) {
                                scannerRef.current.pause(); 
                                setTimeout(() => scannerRef.current.resume(), SCAN_INTERVAL_MS); 
                            }
                        };

                        html5QrcodeScanner.render(onScanSuccess, (errorMessage) => {
                            if (scanStatus.message === 'Preparando el mundo...') {
                                setScanStatus({ type: 'info', message: 'Bloque de escaneo listo. ¡A golpear!' });
                            }
                        });
                        scannerRef.current = html5QrcodeScanner;
                    }, 100);
                } else {
                    if (scannerRef.current) {
                        scannerRef.current.clear().catch(err => console.error("Error clearing scanner on close", err));
                        scannerRef.current = null;
                    }
                }
                return () => { if (scannerRef.current) scannerRef.current.clear().catch(err => {}); };
            }, [isVisible]);

            // Animación de éxito
            const triggerMarioFlash = () => {
                if (appContainerRef.current) {
                    appContainerRef.current.classList.add('flash-mario');
                    setTimeout(() => {
                        appContainerRef.current.classList.remove('flash-mario');
                    }, 300);
                }
            };


            // 2. LÓGICA DE ESCANEO INTELIGENTE
            const handleQuickScan = (rawCode) => {
                if (!rawCode) return;
                const scannedCode = rawCode.trim().toUpperCase().replace(/'/g, '-').replace(/\?/g, '_');

                if (scans.some(s => s.code === scannedCode)) {
                    setScanStatus({ message: `¡Ya tienes ese bloque! (${scannedCode})`, type: 'warning' });
                    playMarioSound('warning'); 
                    return;
                }

                let foundPackage = null;
                for (const order of ordersCache) {
                    if (order.progreso) {
                        const pkg = order.progreso.find(p => p.codigoUnico === scannedCode);
                        if (pkg) {
                            foundPackage = { 
                                code: scannedCode, 
                                orderId: order.id, 
                                modelo: order.codigo, 
                                partida: order.partida,
                                piezaNombre: pkg.piezaNombre,
                                paquete_indice: pkg.paqueteNum, 
                                paquete_total: pkg.paquetesDePieza, 
                                piezas_en_paquete: pkg.cantidad,
                                tejedor: "Joel" 
                            };
                            break;
                        }
                    }
                }

                if (!foundPackage) {
                    setScanStatus({ message: `¡K.O.! Bloque NO encontrado. (${scannedCode})`, type: 'error' });
                    playMarioSound('error'); 
                    return;
                }
                
                playMarioSound('success'); 
                triggerMarioFlash();
                setScans(prev => [...prev, foundPackage]);
                setScanStatus({ type: 'success', message: `¡Moneda! Paquete ${foundPackage.paquete_indice} de ${foundPackage.modelo}` });
            };

            // 3. Guardar todos los escaneos
            const confirmScans = async () => {
                if (scans.length === 0 || isSaving) return;
                setIsSaving(true);
                setScanStatus({ message: `Entrando al tubo de Warp...`, type: 'info' });

                let saved = 0, duplicates = 0, errors = 0;
                const batch = db.batch();
                
                for (const scan of scans) {
                    try {
                        const globalScanCheck = await db.collection('registro_produccion').where('codigo_paquete', '==', scan.code).get();
                        if (!globalScanCheck.empty) { 
                            duplicates++; 
                            continue; 
                        }

                        const docRef = db.collection('registro_produccion').doc();
                        batch.set(docRef, {
                            codigo_paquete: scan.code, 
                            orderId: String(scan.orderId), 
                            fecha: FieldValue.serverTimestamp(),
                            fecha_legible: new Date().toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(/\//g, '/'), 
                            tejedor: scan.tejedor, 
                            tipo: "produccion",
                            modelo: scan.modelo,
                            partida: scan.partida,
                            paquete_indice: scan.paquete_indice, 
                            paquete_total: scan.paquete_total,
                            piezas_en_paquete: scan.piezas_en_paquete
                        });
                        saved++;

                    } catch (error) {
                        console.error("Error saving scan:", error);
                        errors++;
                    }
                }

                if (saved > 0) await batch.commit();

                setIsSaving(false);
                onScanSaved(saved); 
                onClose();
                alert(`¡Nivel completado!\n✅ Guardados: ${saved}\n⚠️ Repetidos: ${duplicates}\n❌ Errores: ${errors}`);
            };

            const handleRemoveScan = (codeToRemove) => setScans(prev => prev.filter(scan => scan.code !== codeToRemove));

            if (!isVisible) return null;

            const statusClass = scanStatus.type === 'info' ? 'bg-blue-600' : (scanStatus.type === 'success' ? 'bg-green-600' : (scanStatus.type === 'warning' ? 'bg-yellow-600' : 'bg-red-600'));

            return (
                <div className="fixed inset-0 bg-black z-50 flex flex-col" ref={appContainerRef}>
                    
                    {/* ENCABEZADO - Ladrillos Marrones */}
                    <div className="p-3 bg-red-800 border-b-4 border-yellow-800 flex justify-between items-center shadow-md shrink-0">
                        <h2 className="text-lg font-bold flex items-center gap-2 text-yellow-400"><Icon name="sword" className="text-yellow-400"/> MUNDO DE TEJIDO</h2>
                        <button onClick={onClose} className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm font-bold flex items-center gap-1"><Icon name="castle" size={16}/> SALIR</button>
                    </div>

                    {/* ZONA DE ESCANEO - Bloque de Ladrillos */}
                    <div className="camera-container-modal shrink-0">
                        <div id="reader-modal"></div>
                        {/* Indicador de estado */}
                        <div className={`absolute bottom-0 w-full text-center py-1 text-xs font-bold ${statusClass}`}>{scanStatus.message}</div>
                    </div>
                    
                    <div className="flex flex-col flex-grow bg-slate-900">
                        {/* Indicador del Buffer - Ladrillo Amarillo/Oro */}
                        <div className="p-2 text-xs font-bold flex justify-between uppercase tracking-wider text-slate-400 border-b border-slate-700 shrink-0 bg-yellow-900/50">
                            <span className="text-yellow-400">Bloques Recolectados</span>
                            <span className="text-white">{scans.length}</span>
                        </div>
                        
                        <div className="flex-grow overflow-y-auto p-3 space-y-2">
                            {scans.length === 0 ? (
                                <div className="text-center text-slate-600 py-4 text-sm italic">¡Salta y golpea un bloque de escaneo!</div>
                            ) : (
                                scans.map(scan => (
                                    <div 
                                        key={scan.code} 
                                        className="flex justify-between items-center bg-red-900/80 p-2 rounded border border-yellow-700 border-l-4 border-yellow-500"
                                    >
                                        <div>
                                            <span className="font-mono font-bold text-base text-white block">{scan.code}</span>
                                            <span className="text-xs text-yellow-300">NIVEL: {scan.modelo} / PQT: {scan.paquete_indice}/{scan.paquete_total}</span>
                                        </div>
                                        <button onClick={() => handleRemoveScan(scan.code)} className="text-red-400 p-1 bg-red-700 rounded-full flex items-center justify-center"><Icon name="trash-2" size={16}/></button>
                                    </div>
                                ))
                            )}
                        </div>
                        
                        {/* BOTÓN - TUBO DE WARP (Verde) */}
                        <div className="p-3 bg-slate-800 border-t-4 border-lime-800 shrink-0">
                            <button 
                                onClick={confirmScans}
                                disabled={scans.length === 0 || isSaving}
                                className={`w-full py-3 rounded-t-xl rounded-b-lg font-bold text-lg shadow-2xl flex items-center justify-center gap-2 transition-all
                                    ${scans.length > 0 && !isSaving ? 'bg-lime-600 text-white hover:bg-lime-500 shadow-lime-500/50' : 'bg-slate-700 text-slate-500'}
                                `}
                            >
                                {isSaving ? <><Icon name="loader-2" className="animate-spin"/> ENTRANDO AL WARP...</> : <><Icon name="arrow-down-to-dot"/> WARP A BASE DE DATOS ({scans.length})</>}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };


        // --- COMPONENTE PRINCIPAL ---
        const ScannerG6 = () => {
            const [ordersCache, setOrdersCache] = useState([]);
            const [statusMsg, setStatusMsg] = useState("Cargando el Reino Champiñón...");
            const [errorMsg, setErrorMsg] = useState("");
            const [showScanner, setShowScanner] = useState(false);
            const [lastSaveCount, setLastSaveCount] = useState(0);

            // Cargar datos
            useEffect(() => {
                const unsubscribe = db.collection('orders')
                    .where('status', '!=', 'ARCHIVADO')
                    .onSnapshot(snapshot => {
                        const loadedOrders = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                        setOrdersCache(loadedOrders);
                        setStatusMsg(`¡Base de datos cargada! ${loadedOrders.length} mundos activos.`);
                    }, err => {
                        setErrorMsg("Error: Bowser atacó la base de datos: " + err.message);
                    });
                return () => unsubscribe();
            }, []);

            return (
                <div className="app-container bg-red-950 text-white relative">

                    {/* HEADER - MARIO THEME */}
                    <div className="p-3 bg-red-800 flex justify-between items-center shadow-md z-20 shrink-0 border-b-4 border-yellow-800">
                        <div className="font-bold flex items-center gap-2">
                            <Icon name="crown" className="text-yellow-400" />
                            <span>TEJEDOR: JOEL</span>
                        </div>
                        <div className="text-xs text-yellow-400 font-mono">{ordersCache.length} MUNDOS</div>
                    </div>

                    {/* STATUS BAR */}
                    {(errorMsg || statusMsg) && (
                        <div className={`p-1 text-xs text-center font-mono truncate ${errorMsg ? 'bg-red-900 text-white' : 'bg-slate-700 text-slate-300'} shrink-0`}>
                            {errorMsg || statusMsg}
                        </div>
                    )}

                    {/* MAIN CONTENT / BUTTON */}
                    <div className="flex-grow flex flex-col items-center justify-center p-4 bg-red-900">
                        <button 
                            onClick={() => setShowScanner(true)} 
                            className="bg-red-600 hover:bg-red-500 text-white px-8 py-6 rounded-full font-bold text-2xl shadow-2xl flex flex-col items-center gap-4 transition transform active:scale-95 border-8 border-white/50"
                        >
                            <Icon name="star" size={48} className="text-yellow-400 animate-pulse"/>
                            <span>¡VAMOS! INICIAR NIVEL</span>
                        </button>
                        {lastSaveCount > 0 && (
                            <div className="mt-6 bg-lime-700 text-white p-3 rounded-lg text-sm font-bold animate-pulse shadow-md">
                                🌟 ¡PUNTAJE! {lastSaveCount} Bloques guardados.
                            </div>
                        )}
                        <div className="mt-8 text-center text-red-300 text-sm">
                            <Icon name="flag-triangle-right" size={16} className="inline-block mr-1 text-red-500"/>
                            Niveles (órdenes) activos: {ordersCache.length}
                        </div>
                    </div>
                    
                    {/* MODAL DEL ESCANER */}
                    <QuickScannerModal
                        isVisible={showScanner}
                        onClose={() => setShowScanner(false)}
                        ordersCache={ordersCache}
                        onScanSaved={setLastSaveCount} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScannerG6 />);
    </script>
</body>
</html>
