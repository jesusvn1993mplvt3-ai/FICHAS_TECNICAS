<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balta Scan Pro v21</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; background: #000; font-family: 'Roboto Condensed', sans-serif; color: white; height: 100vh; overflow: hidden; }
        .scanner-container { position: relative; width: 100%; height: 30vh; background: #000; overflow: hidden; }
        #reader { width: 100% !important; height: 100% !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        .results-container { flex: 1; display: flex; flex-direction: column; background: #f8fafc; border-radius: 24px 24px 0 0; margin-top: -20px; z-index: 20; position: relative; overflow: hidden; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px; }
        .fixed-footer { background: white; padding: 15px; border-top: 1px solid #e2e8f0; }
        
        /* Estilos de Papeleta Clásica */
        .lbl-card { background: white; color: black; border: 1px solid #000; display: flex; aspect-ratio: 6/4; margin-bottom: 12px; transform: scale(0.95); }
        .lbl-col-img { width: 25%; border-right: 2px solid #000; display: flex; align-items: center; justify-content: center; padding: 2px; }
        .lbl-col-data { width: 60%; border-right: 2px solid #000; display: flex; flex-direction: column; }
        .lbl-row { display: flex; border-bottom: 2px solid #000; width: 100%; }
        .lbl-title { font-size: 7px; font-weight: bold; color: #666; }
        .lbl-val { font-family: 'Oswald'; font-weight: bold; font-size: 16px; line-height: 1; }
        
        /* Estilo Modo Entrada de Datos */
        .entry-row { background: white; border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid #e2e8f0; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        .input-maq { width: 80px; background: #eff6ff; border: 2px solid #bfdbfe; border-radius: 8px; padding: 8px; text-align: center; font-weight: 900; font-size: 1.2rem; color: #1d4ed8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = { 
            apiKey: "AIzaSyCngQL1pdqghv2vbjkPycT1Xf0C46f7jYs", 
            authDomain: "cirineo-cec21.firebaseapp.com", 
            projectId: "cirineo-cec21", 
            storageBucket: "cirineo-cec21.firebasestorage.app", 
            messagingSenderId: "620210618284", 
            appId: "1:620210618284:web:482bab9bf74650fff18409" 
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Componente de Papeleta Gráfica
        const VisualLabel = ({ data, imageSources }) => {
            const svgRef = useRef(null);
            const [imgSrc, setImgSrc] = useState(null);
            useEffect(() => {
                if(imageSources?.[0]) setImgSrc(`${imageSources[0].url}/${data.modelo}.jpg`);
                if (svgRef.current) JsBarcode(svgRef.current, data.codigoUnico, { width: 2, height: 40, displayValue: false, margin: 0 });
            }, [data, imageSources]);

            return (
                <div className="lbl-card">
                    <div className="lbl-col-img"><img src={imgSrc} className="w-full h-full object-contain" /></div>
                    <div className="lbl-col-data">
                        <div className="lbl-row h-1/4"><div className="p-1"><div className="lbl-title">MODELO</div><div className="lbl-val">{data.modelo}</div></div></div>
                        <div className="lbl-row h-1/4 bg-black text-white items-center justify-center font-bold">{ (data.piezaNombre||'').split(' ')[0] }</div>
                        <div className="lbl-row h-1/4">
                            <div className="flex-1 border-r border-black p-1"><div className="lbl-title">PAQ</div><div className="lbl-val">{data.displayPackageId}</div></div>
                            <div className="flex-1 p-1 bg-gray-100 text-black"><div className="lbl-title">CANT</div><div className="lbl-val">{data.cantidad}</div></div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [kits, setKits] = useState([]);
            const [orders, setOrders] = useState([]);
            const [imageSources, setImageSources] = useState([]);
            const [cameraActive, setCameraActive] = useState(false);
            
            const [pending, setPending] = useState(null);
            const [showGraphic, setShowGraphic] = useState(true); // Controla si se ve la papeleta o el input
            const [machinesMap, setMachinesMap] = useState({}); // Guarda máquina por código único

            useEffect(() => {
                db.collection('kits_produccion').onSnapshot(s => setKits(s.docs.map(d => d.data())));
                db.collection('orders').where('status', '!=', 'ARCHIVADO').onSnapshot(s => setOrders(s.docs.map(d => ({id: d.id, ...d.data()}))));
                db.collection('app_config').doc('imagenes').onSnapshot(d => setImageSources(d.data()?.sources || []));
            }, []);

            const initScanner = () => {
                setCameraActive(true);
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (text) => {
                        const code = text.toUpperCase();
                        let foundItems = [];
                        let idKey = code;

                        if (code.startsWith('K')) {
                            const k = kits.find(x => x.kitId === code);
                            if (k) foundItems = k.piezas.map(p => findInOrders(p.codigoUnico) || {...p, modelo: k.modelo, displayPackageId: '?'});
                        } else {
                            const item = findInOrders(code);
                            if (item) foundItems = [item];
                        }

                        if (foundItems.length > 0) {
                            setPending({ id: idKey, items: foundItems });
                            setShowGraphic(true);
                            // Timer de 3 segundos para cambiar a modo texto
                            setTimeout(() => setShowGraphic(false), 3000);
                        }
                    });
                }, 500);
            };

            const findInOrders = (code) => {
                for (let o of orders) {
                    const p = o.progreso?.find(x => x.codigoUnico === code);
                    if (p) return { ...p, modelo: o.codigo, orderId: o.id, displayPackageId: `${p.paqueteNum}/${p.paquetesDePieza}` };
                }
                return null;
            };

            const updateMachine = (uniqueCode, val) => {
                setMachinesMap(prev => ({ ...prev, [uniqueCode]: val }));
            };

            const copyToAll = () => {
                const firstVal = machinesMap[pending.items[0].codigoUnico];
                if (!firstVal) return;
                const newMap = {};
                pending.items.forEach(it => newMap[it.codigoUnico] = firstVal);
                setMachinesMap(newMap);
            };

            const confirmFinal = async () => {
                // Validar que todos tengan máquina
                const incomplete = pending.items.some(it => !machinesMap[it.codigoUnico]);
                if (incomplete) return alert("Faltan máquinas por asignar");

                const batch = db.batch();
                pending.items.forEach(it => {
                    batch.set(db.collection('registro_produccion').doc(), {
                        code: it.codigoUnico, modelo: it.modelo,
                        fecha: firebase.firestore.FieldValue.serverTimestamp(),
                        maquina: machinesMap[it.codigoUnico],
                        tejedor: "Balta Scan"
                    });
                });
                await batch.commit();
                window.location.reload();
            };

            return (
                <div className="h-full flex flex-col bg-black">
                    {!cameraActive ? (
                        <div className="flex-1 flex flex-col items-center justify-center p-10">
                            <button onClick={initScanner} className="w-full bg-blue-600 py-8 rounded-3xl font-black text-2xl shadow-2xl">ENCENDER ESCÁNER</button>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col">
                            <div className="scanner-container">
                                <div id="reader"></div>
                                {!pending && <div className="absolute inset-0 flex items-center justify-center border-4 border-blue-500/30 m-10 rounded-3xl"></div>}
                            </div>

                            <div className="results-container">
                                {!pending ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-slate-400">
                                        <p className="font-bold animate-pulse">LISTO PARA ESCANEAR</p>
                                    </div>
                                ) : (
                                    <div className="flex flex-col h-full">
                                        <div className="p-4 bg-white border-b flex justify-between items-center">
                                            <span className="font-black text-blue-900">{pending.id}</span>
                                            {showGraphic && <span className="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded animate-pulse font-bold">REVISANDO PAPELETA...</span>}
                                        </div>

                                        <div className="scroll-area">
                                            {showGraphic ? (
                                                /* MODO 1: VISUAL (3 segundos) */
                                                pending.items.map((it, i) => <VisualLabel key={i} data={it} imageSources={imageSources} />)
                                            ) : (
                                                /* MODO 2: ENTRADA DE DATOS (Después de 3 segundos) */
                                                <div className="animate-in fade-in duration-500">
                                                    <div className="flex justify-between items-center mb-4">
                                                        <h3 className="font-black text-slate-700">ASIGNAR MÁQUINAS</h3>
                                                        {pending.items.length > 1 && (
                                                            <button onClick={copyToAll} className="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold">Igualar Todas ↑</button>
                                                        )}
                                                    </div>
                                                    {pending.items.map((it, i) => (
                                                        <div key={i} className="entry-row shadow-sm">
                                                            <div className="flex-1">
                                                                <div className="text-xs font-black text-blue-600">{it.codigoUnico}</div>
                                                                <div className="font-bold text-sm text-slate-700">{it.modelo} - {(it.piezaNombre||'').split(' ')[0]}</div>
                                                            </div>
                                                            <input 
                                                                type="number" 
                                                                placeholder="#"
                                                                className="input-maq"
                                                                value={machinesMap[it.codigoUnico] || ''}
                                                                onChange={(e) => updateMachine(it.codigoUnico, e.target.value)}
                                                                autoFocus={i === 0}
                                                            />
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="fixed-footer grid grid-cols-2 gap-4">
                                            <button onClick={() => window.location.reload()} className="bg-slate-100 py-4 rounded-2xl font-bold text-slate-400 uppercase text-xs">Descartar</button>
                                            <button onClick={confirmFinal} className="bg-green-600 py-4 rounded-2xl font-black text-white shadow-lg shadow-green-200">FINALIZAR</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
