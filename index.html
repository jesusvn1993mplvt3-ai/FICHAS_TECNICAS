<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balta Scan Pro v20</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; background: #000; font-family: 'Roboto Condensed', sans-serif; color: white; height: 100vh; overflow: hidden; }
        
        .scanner-container {
            position: relative;
            width: 100%;
            height: 35vh;
            background: #000;
            overflow: hidden;
        }

        /* Forzamos que el video ocupe todo el espacio */
        #reader { width: 100% !important; height: 100% !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        
        /* Limpieza de UI de la librería */
        #reader__scan_region { display: block !important; height: 100%; }
        #reader img { display: none !important; }
        #reader__dashboard_section_csr button { display: none !important; }

        .scan-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
        }
        .scan-box {
            width: 70%; height: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.5);
        }

        .results-container {
            flex: 1; display: flex; flex-direction: column;
            background: #f1f5f9; border-radius: 24px 24px 0 0;
            margin-top: -20px; z-index: 20; position: relative; overflow: hidden;
        }
        
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px; }

        .fixed-footer {
            background: white; padding: 15px; padding-bottom: 30px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1); z-index: 30;
        }

        /* Estilos de Papeleta (Mini) */
        .lbl-card { background: white; color: black; border: 1px solid #000; display: flex; aspect-ratio: 6/4; margin-bottom: 12px; }
        .lbl-col-img { width: 25%; border-right: 2px solid #000; display: flex; align-items: center; justify-content: center; padding: 2px; }
        .lbl-col-data { width: 60%; border-right: 2px solid #000; display: flex; flex-direction: column; }
        .lbl-col-bc { width: 15%; display: flex; align-items: center; justify-content: center; }
        .lbl-row { display: flex; border-bottom: 2px solid #000; width: 100%; }
        .lbl-title { font-size: 8px; font-weight: bold; color: #444; }
        .lbl-val { font-family: 'Oswald'; font-weight: bold; font-size: 18px; line-height: 1; color: #000; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuración Firebase (la misma)
        const firebaseConfig = { 
            apiKey: "AIzaSyCngQL1pdqghv2vbjkPycT1Xf0C46f7jYs", 
            authDomain: "cirineo-cec21.firebaseapp.com", 
            projectId: "cirineo-cec21", 
            storageBucket: "cirineo-cec21.firebasestorage.app", 
            messagingSenderId: "620210618284", 
            appId: "1:620210618284:web:482bab9bf74650fff18409" 
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const VisualLabel = ({ data, imageSources, manualMachine }) => {
            const svgRef = useRef(null);
            const modelo = data.modelo || 'S/N';
            const barcodeValue = data.codigoUnico || '0000';
            const maq = manualMachine || data.maquina || '0';

            const [imgSrc, setImgSrc] = useState(null);
            const [currentIdx, setCurrentIdx] = useState(0);

            useEffect(() => {
                if(imageSources?.[0]) setImgSrc(`${imageSources[0].url}/${modelo}.jpg`);
            }, [modelo, imageSources]);

            const handleError = () => {
                if(currentIdx + 1 < imageSources.length) {
                    setCurrentIdx(currentIdx + 1);
                    setImgSrc(`${imageSources[currentIdx+1].url}/${modelo}.jpg`);
                }
            };

            useEffect(() => {
                if (svgRef.current && barcodeValue) {
                    JsBarcode(svgRef.current, barcodeValue, { format: "CODE128", width: 2, height: 40, displayValue: false, margin: 0 });
                }
            }, [barcodeValue]);

            return (
                <div className="lbl-card shadow-lg">
                    <div className="lbl-col-img">
                        <img src={imgSrc} onError={handleError} className="w-full h-full object-contain" />
                    </div>
                    <div className="lbl-col-data">
                        <div className="lbl-row" style={{height:'25%'}}>
                            <div className="p-1 flex-1 border-r-2 border-black">
                                <div className="lbl-title">MODELO</div>
                                <div className="lbl-val">{modelo}</div>
                            </div>
                            <div className="p-1 flex-1">
                                <div className="lbl-title">CLIENTE</div>
                                <div className="text-[10px] font-bold truncate">{data.cliente || '-'}</div>
                            </div>
                        </div>
                        <div className="lbl-row bg-black text-white items-center justify-center" style={{height:'25%'}}>
                            <span className="font-bold text-xl Oswald uppercase tracking-widest">{(data.piezaNombre||'').split(' ')[0]}</span>
                        </div>
                        <div className="lbl-row" style={{height:'30%'}}>
                            <div className="flex-1 border-r-2 border-black p-1 text-center">
                                <div className="lbl-title">PAQ</div>
                                <div className="lbl-val">{data.displayPackageId}</div>
                            </div>
                            <div className="flex-1 border-r-2 border-black p-1 text-center bg-gray-200">
                                <div className="lbl-title">CANT</div>
                                <div className="lbl-val">{data.cantidad}</div>
                            </div>
                            <div className="flex-1 p-1 text-center bg-black text-white">
                                <div className="lbl-title text-gray-400">MAQ</div>
                                <div className="lbl-val text-white">{maq}</div>
                            </div>
                        </div>
                        <div className="flex flex-1">
                            <div className="flex-1 p-1 border-r-2 border-black">
                                <div className="lbl-title">TALLA</div>
                                <div className="font-bold text-xs">{data.talla}</div>
                            </div>
                            <div className="flex-1 p-1">
                                <div className="lbl-title">PARTIDA</div>
                                <div className="font-bold text-xs">{data.partida}</div>
                            </div>
                        </div>
                    </div>
                    <div className="lbl-col-bc">
                         <div style={{transform: 'rotate(90deg)', width: '85px'}}>
                            <svg ref={svgRef} className="w-full h-auto"></svg>
                         </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [kits, setKits] = useState([]);
            const [orders, setOrders] = useState([]);
            const [imageSources, setImageSources] = useState([]);
            const [cameraActive, setCameraActive] = useState(false);
            const [pending, setPending] = useState(null);
            const [machine, setMachine] = useState('');
            const [error, setError] = useState(null);
            const scannerRef = useRef(null);

            useEffect(() => {
                db.collection('kits_produccion').onSnapshot(s => setKits(s.docs.map(d => d.data())));
                db.collection('orders').where('status', '!=', 'ARCHIVADO').onSnapshot(s => setOrders(s.docs.map(d => ({id: d.id, ...d.data()}))));
                db.collection('app_config').doc('imagenes').onSnapshot(d => setImageSources(d.data()?.sources || []));
            }, []);

            const initCamera = () => {
                setCameraActive(true);
                setError(null);
                setTimeout(() => {
                    const html5QrCode = new Html5Qrcode("reader");
                    scannerRef.current = html5QrCode;
                    html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 20, qrbox: { width: 250, height: 150 } },
                        (text) => handleScan(text.toUpperCase())
                    ).catch(err => {
                        console.error(err);
                        setError("No se pudo acceder a la cámara. Revisa los permisos.");
                    });
                }, 500);
            };

            const handleScan = (code) => {
                if (pending) return;
                
                if (code.startsWith('K')) {
                    const k = kits.find(x => x.kitId === code);
                    if (k) {
                        const items = k.piezas.map(p => findInOrders(p.codigoUnico) || {...p, modelo: k.modelo, displayPackageId: '?'});
                        setPending({ id: code, items, type: 'KIT' });
                    }
                } else {
                    const item = findInOrders(code);
                    if (item) setPending({ id: code, items: [item], type: 'INDV' });
                }
            };

            const findInOrders = (code) => {
                for (let o of orders) {
                    const p = o.progreso?.find(x => x.codigoUnico === code);
                    if (p) return { ...p, modelo: o.codigo, cliente: o.cliente, partida: o.partida, orderId: o.id, displayPackageId: `${p.paqueteNum}/${p.paquetesDePieza}` };
                }
                return null;
            };

            const save = async () => {
                if (!machine) return alert("Escribe la máquina");
                const batch = db.batch();
                pending.items.forEach(p => {
                    batch.set(db.collection('registro_produccion').doc(), {
                        code: p.codigoUnico, modelo: p.modelo, orderId: p.orderId||'?', 
                        partida: p.partida||'?', tejedor: "Balta Scan",
                        fecha: firebase.firestore.FieldValue.serverTimestamp(),
                        maquina: machine, finished: false
                    });
                });
                await batch.commit();
                window.location.reload();
            };

            return (
                <div className="h-full flex flex-col bg-black">
                    {!cameraActive ? (
                        <div className="flex-1 flex flex-col items-center justify-center p-10 text-center">
                            <div className="w-32 h-32 bg-blue-600 rounded-full flex items-center justify-center mb-8 shadow-2xl shadow-blue-500/50">
                                <Lucide name="camera" size={48} color="white" />
                            </div>
                            <h1 className="text-3xl font-black mb-4">BALTA SCAN v20</h1>
                            <button onClick={initCamera} className="w-full bg-blue-600 py-6 rounded-2xl font-bold text-xl">EMPEZAR A ESCANEAR</button>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col overflow-hidden">
                            <div className="scanner-container">
                                <div id="reader"></div>
                                {!pending && <div className="scan-overlay"><div className="scan-box"></div></div>}
                                {error && (
                                    <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center z-50">
                                        <p className="text-red-400 font-bold mb-4">{error}</p>
                                        <button onClick={() => window.location.reload()} className="bg-white text-black px-6 py-2 rounded-lg font-bold">REINTENTAR</button>
                                    </div>
                                )}
                            </div>

                            <div className="results-container shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                                {!pending ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-slate-400">
                                        <div className="animate-bounce mb-2"><Lucide name="scan" size={40} /></div>
                                        <p className="font-bold text-sm">ESPERANDO CÓDIGO...</p>
                                    </div>
                                ) : (
                                    <div className="flex-1 flex flex-col overflow-hidden">
                                        <div className="p-4 bg-white border-b flex justify-between items-center">
                                            <span className="font-black text-xl text-blue-900">{pending.id}</span>
                                            <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-black">{pending.items.length} PAQUETES</span>
                                        </div>
                                        <div className="scroll-area">
                                            {pending.items.map((it, i) => (
                                                <VisualLabel key={i} data={it} imageSources={imageSources} manualMachine={machine} />
                                            ))}
                                        </div>
                                        <div className="fixed-footer">
                                            <div className="mb-4">
                                                <label className="text-[10px] font-black text-slate-400 uppercase">Número de Máquina:</label>
                                                <input type="number" value={machine} onChange={e=>setMachine(e.target.value)} autoFocus className="w-full bg-slate-100 p-4 rounded-xl text-center text-3xl font-black text-blue-600 border-2 border-blue-200 outline-none focus:border-blue-600" placeholder="0" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <button onClick={()=>window.location.reload()} className="bg-slate-200 py-5 rounded-2xl font-bold text-slate-500">DESCARTAR</button>
                                                <button onClick={save} className="bg-blue-600 py-5 rounded-2xl font-bold text-white shadow-xl">CONFIRMAR</button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Lucide = ({ name, size = 24, color = "currentColor" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && lucide.icons[name]) {
                    ref.current.innerHTML = lucide.icons[name].toSvg({ width: size, height: size, color });
                }
            }, [name, size, color]);
            return <span ref={ref} className="inline-block"></span>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
