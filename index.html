<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balta Scan Pro v22</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; background: #000; font-family: 'Roboto Condensed', sans-serif; color: white; height: 100vh; overflow: hidden; }
        .scanner-container { position: relative; width: 100%; height: 30vh; background: #000; overflow: hidden; }
        #reader { width: 100% !important; height: 100% !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        .results-container { flex: 1; display: flex; flex-direction: column; background: #f8fafc; border-radius: 24px 24px 0 0; margin-top: -20px; z-index: 20; position: relative; overflow: hidden; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 15px; }
        .fixed-footer { background: white; padding: 15px; border-top: 1px solid #e2e8f0; }
        
        .lbl-card { background: white; color: black; border: 1px solid #000; display: flex; aspect-ratio: 6/4; margin-bottom: 12px; }
        .lbl-col-img { width: 25%; border-right: 2px solid #000; display: flex; align-items: center; justify-content: center; padding: 2px; }
        .lbl-col-data { width: 60%; border-right: 2px solid #000; display: flex; flex-direction: column; }
        .lbl-title { font-size: 7px; font-weight: bold; color: #666; }
        .lbl-val { font-family: 'Oswald'; font-weight: bold; font-size: 16px; line-height: 1; }
        
        .entry-row { background: white; border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid #e2e8f0; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        .input-maq { width: 85px; background: #eff6ff; border: 2px solid #3b82f6; border-radius: 8px; padding: 8px; text-align: center; font-weight: 900; font-size: 1.3rem; color: #1d4ed8; outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = { 
            apiKey: "AIzaSyCngQL1pdqghv2vbjkPycT1Xf0C46f7jYs", 
            authDomain: "cirineo-cec21.firebaseapp.com", 
            projectId: "cirineo-cec21", 
            storageBucket: "cirineo-cec21.firebasestorage.app", 
            messagingSenderId: "620210618284", 
            appId: "1:620210618284:web:482bab9bf74650fff18409" 
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const VisualLabel = ({ data, imageSources }) => {
            const svgRef = useRef(null);
            const [imgSrc, setImgSrc] = useState(null);
            useEffect(() => {
                if(imageSources?.[0]) setImgSrc(`${imageSources[0].url}/${data.modelo}.jpg`);
                if (svgRef.current) JsBarcode(svgRef.current, data.codigoUnico, { width: 2, height: 40, displayValue: false, margin: 0 });
            }, [data, imageSources]);

            return (
                <div className="lbl-card scale-95 origin-top">
                    <div className="lbl-col-img"><img src={imgSrc} className="w-full h-full object-contain" /></div>
                    <div className="lbl-col-data">
                        <div className="lbl-row h-1/4"><div className="p-1"><div className="lbl-title">MODELO</div><div className="lbl-val">{data.modelo}</div></div></div>
                        <div className="lbl-row h-1/4 bg-black text-white items-center justify-center font-bold">{(data.piezaNombre||'').split(' ')[0]}</div>
                        <div className="lbl-row h-1/4">
                            <div className="flex-1 border-r border-black p-1"><div className="lbl-title">PAQ</div><div className="lbl-val">{data.displayPackageId}</div></div>
                            <div className="flex-1 p-1 bg-gray-100"><div className="lbl-title">CANT</div><div className="lbl-val">{data.cantidad}</div></div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [kits, setKits] = useState([]);
            const [orders, setOrders] = useState([]);
            const [imageSources, setImageSources] = useState([]);
            const [cameraActive, setCameraActive] = useState(false);
            const [pending, setPending] = useState(null);
            const [showGraphic, setShowGraphic] = useState(true);
            const [machinesMap, setMachinesMap] = useState({});

            useEffect(() => {
                db.collection('kits_produccion').onSnapshot(s => setKits(s.docs.map(d => d.data())));
                db.collection('orders').where('status', '!=', 'ARCHIVADO').onSnapshot(s => setOrders(s.docs.map(d => ({id: d.id, ...d.data()}))));
                db.collection('app_config').doc('imagenes').onSnapshot(d => setImageSources(d.data()?.sources || []));
            }, []);

            const initScanner = () => {
                setCameraActive(true);
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (text) => {
                        const code = text.toUpperCase();
                        let foundItems = [];
                        if (code.startsWith('K')) {
                            const k = kits.find(x => x.kitId === code);
                            if (k) foundItems = k.piezas.map(p => findInOrders(p.codigoUnico) || {...p, modelo: k.modelo, displayPackageId: '?'});
                        } else {
                            const item = findInOrders(code);
                            if (item) foundItems = [item];
                        }

                        if (foundItems.length > 0) {
                            setPending({ id: code, items: foundItems });
                            setShowGraphic(true);
                            setTimeout(() => setShowGraphic(false), 3000);
                        }
                    });
                }, 500);
            };

            const findInOrders = (code) => {
                for (let o of orders) {
                    const p = o.progreso?.find(x => x.codigoUnico === code);
                    if (p) return { ...p, modelo: o.codigo, orderId: o.id, cliente: o.cliente, partida: o.partida, displayPackageId: `${p.paqueteNum}/${p.paquetesDePieza}` };
                }
                return null;
            };

            const confirmFinal = async () => {
                const incomplete = pending.items.some(it => !machinesMap[it.codigoUnico]);
                if (incomplete) return alert("Asigna máquina a todos los paquetes");

                const batch = db.batch();
                
                for (const it of pending.items) {
                    const maqElegida = machinesMap[it.codigoUnico];
                    
                    // 1. REGISTRO DE PRODUCCIÓN (Para el historial y el consolidador)
                    const regRef = db.collection('registro_produccion').doc();
                    batch.set(regRef, {
                        code: it.codigoUnico,
                        modelo: it.modelo,
                        cliente: it.cliente || '',
                        partida: it.partida || '',
                        paquete_indice: it.paqueteNum || 0,
                        maquina: maqElegida, // Campo raíz para el consolidador
                        fecha: firebase.firestore.FieldValue.serverTimestamp(),
                        tejedor: "Balta Scan",
                        finished: false
                    });

                    // 2. ACTUALIZAR LA ORDEN ORIGINAL (Para que el consolidador no lo mande a "Sin asignar")
                    if (it.orderId) {
                        const orderRef = db.collection('orders').doc(it.orderId);
                        const orderData = orders.find(o => o.id === it.orderId);
                        if (orderData && orderData.progreso) {
                            const nuevoProgreso = orderData.progreso.map(p => {
                                if (p.codigoUnico === it.codigoUnico) {
                                    return { ...p, maquina: maqElegida }; // Actualizamos la máquina en la orden
                                }
                                return p;
                            });
                            batch.update(orderRef, { progreso: nuevoProgreso });
                        }
                    }
                }

                try {
                    await batch.commit();
                    window.location.reload();
                } catch (e) {
                    alert("Error al guardar: " + e.message);
                }
            };

            return (
                <div className="h-full flex flex-col bg-black">
                    {!cameraActive ? (
                        <div className="flex-1 flex flex-col items-center justify-center p-10">
                            <button onClick={initScanner} className="w-full bg-blue-600 py-8 rounded-3xl font-black text-2xl shadow-2xl">ACTIVAR CÁMARA</button>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col">
                            <div className="scanner-container">
                                <div id="reader"></div>
                                {!pending && <div className="absolute inset-0 flex items-center justify-center border-4 border-blue-500/20 m-12 rounded-3xl pointer-events-none"></div>}
                            </div>

                            <div className="results-container shadow-[0_-10px_40px_rgba(0,0,0,0.4)]">
                                {!pending ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-slate-400">
                                        <p className="font-bold tracking-widest animate-pulse">ESPERANDO ESCANEO</p>
                                    </div>
                                ) : (
                                    <div className="flex flex-col h-full">
                                        <div className="p-4 bg-white border-b flex justify-between items-center">
                                            <span className="font-black text-blue-900 text-lg uppercase">{pending.id}</span>
                                            {showGraphic ? (
                                                <span className="text-[10px] bg-blue-600 text-white px-2 py-1 rounded-lg font-bold">VERIFICANDO...</span>
                                            ) : (
                                                <button onClick={() => setMachinesMap(Object.fromEntries(pending.items.map(it => [it.codigoUnico, machinesMap[pending.items[0].codigoUnico]])))} className="text-[10px] bg-slate-800 text-white px-3 py-1 rounded-full font-bold">IGUALAR MÁQUINAS</button>
                                            )}
                                        </div>

                                        <div className="scroll-area">
                                            {showGraphic ? (
                                                pending.items.map((it, i) => <VisualLabel key={i} data={it} imageSources={imageSources} />)
                                            ) : (
                                                <div className="space-y-3">
                                                    {pending.items.map((it, i) => (
                                                        <div key={i} className="entry-row shadow-sm">
                                                            <div className="flex-1">
                                                                <div className="text-[10px] font-black text-blue-500 leading-none mb-1">{it.codigoUnico}</div>
                                                                <div className="font-bold text-slate-800 leading-none">{(it.piezaNombre||'PAQUETE').split(' ')[0]}</div>
                                                                <div className="text-[10px] text-slate-500 font-bold">{it.modelo}</div>
                                                            </div>
                                                            <input 
                                                                type="number" 
                                                                className="input-maq"
                                                                value={machinesMap[it.codigoUnico] || ''}
                                                                onChange={(e) => setMachinesMap({...machinesMap, [it.codigoUnico]: e.target.value})}
                                                                placeholder="MÁQ"
                                                            />
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="fixed-footer grid grid-cols-2 gap-4">
                                            <button onClick={() => window.location.reload()} className="bg-slate-100 py-5 rounded-2xl font-bold text-slate-400 uppercase text-xs">Descartar</button>
                                            <button onClick={confirmFinal} className="bg-blue-600 py-5 rounded-2xl font-black text-white text-lg">ENVIAR TODO</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
