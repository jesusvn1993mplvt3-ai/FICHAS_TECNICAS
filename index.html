<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FF00FF">
    <title>VIVA ROUSS & Monitor de Máquinas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* --- VARIABLES GLOBALES --- */
        :root {
            --fucsia: #FF00FF;
            --negro-mate: #121212;
            --negro-puro: #000000;
        }

        /* --- ESTRUCTURA DE PANTALLA DIVIDIDA --- */
        body {
            background-color: var(--negro-puro);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-rows: 50% 50%;
            overflow: hidden;
        }

        .split-top {
            background-image: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 3px solid var(--fucsia);
        }

        .split-bottom {
            background-color: var(--negro-mate);
            overflow: hidden; 
            position: relative;
        }

        /* --- ESTILOS VIVA ROUSS --- */
        .vr-container { width: 100%; max-width: 450px; text-align: center; }
        h1.vr-title {
            font-family: 'Black Ops One', cursive;
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            color: var(--fucsia);
            margin: 0;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }
        .vr-subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            color: #ffffff;
            display: block;
            text-align: right;
            margin-top: -5px;
            margin-bottom: 20px;
            padding-right: 15px;
            font-weight: 700;
        }

        .link-card {
            background: var(--negro-mate); border: 1px solid #333; border-radius: 15px;
            padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center;
            text-decoration: none; color: white; transition: 0.3s;
        }
        .link-card:hover { border-color: var(--fucsia); transform: scale(1.02); background: #1a1a1a; }
        /* Estilo para los iconos de Font Awesome/Remixicon */
        .link-icon { font-size: 1.3rem; width: 35px; color: var(--fucsia); margin-right: 10px; text-align: center; }
        /* Estilo para los iconos de GitHub (imágenes) */
        .link-icon-img { width: 35px; height: 35px; margin-right: 10px; object-fit: contain; }
        .link-text { font-size: 1rem; font-weight: 500; flex-grow: 1; text-align: left; }

        #admin-panel { display: none; background: #0a0a0a; border: 1px dashed var(--fucsia); padding: 15px; border-radius: 15px; margin-top: 10px; width: 100%; max-width: 450px;}
        .vr-input, .vr-select, .vr-save-btn { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; box-sizing: border-box; }
        .vr-save-btn { background: var(--fucsia); border: none; font-family: 'Black Ops One'; font-size: 1rem; cursor: pointer; }

        /* Estilos específicos para la previsualización del icono de GitHub */
        #icono-preview {
            display: none; /* Se muestra con JS */
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #1a1a1a;
            height: 50px;
        }
    </style>
</head>
<body>

    <div class="split-top">
        <div class="vr-container">
            <h1 class="vr-title">VIVA ROUSS</h1>
            <span class="vr-subtitle">by Liliana</span>
            <button id="install-btn"><i class="fas fa-download"></i> INSTALAR APP</button>
            <div id="links-container"></div>
            <button id="admin-toggle" onclick="toggleAdmin()">⚙️</button>
            
            <div id="admin-panel">
                <h2 style="color:var(--fucsia); font-size: 1rem; margin-top:0;">NUEVOS VÍNCULOS</h2>
                <input type="text" class="vr-input" id="titulo" placeholder="Nombre">
                <input type="url" class="vr-input" id="url" placeholder="URL">
                
                <select id="icono" class="vr-select">
                    <option value="fa-brands fa-instagram">📸 Instagram (CSS)</option>
                    <option value="fa-brands fa-tiktok">🎵 TikTok (CSS)</option>
                    <option value="fa-brands fa-whatsapp">💬 WhatsApp (CSS)</option>
                    <option value="ri-store-2-line">🛍️ Tienda (CSS)</option>
                    <option value="custom">🖼️ Custom/GitHub (IMAGEN)</option>
                </select>

                <input type="text" class="vr-input" id="icono-manual" placeholder="Ej: fa-solid fa-fire o archivo.png" style="display:none;">

                <div id="icono-preview" style="display:none;">
                    <span style="color: #666; font-size: 0.8rem;" id="preview-text">Previsualización aquí</span>
                    <img id="preview-img" style="width: 30px; height: 30px; display:none; object-fit: contain;" alt="Icono">
                </div>
                
                <button class="vr-save-btn" onclick="agregarEnlace()">GUARDAR</button>
            </div>
        </div>
    </div>

    <div class="split-bottom">
        <div id="root"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // IMPORTANTE: REEMPLAZA ESTA URL CON LA RUTA CRUDA DE TU REPOSITORIO DE ICONOS
        const GITHUB_ICONS_BASE_URL = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/icons/";

        const firebaseConfig = { apiKey: "AIzaSyBqHgV4vDat1-VmZfKbiPg7nuiX-ROcexw", authDomain: "cirineo-cec21.firebaseapp.com", projectId: "cirineo-cec21", storageBucket: "cirineo-cec21.firebasestorage.app", messagingSenderId: "620210618284", appId: "1:620210618284:web:482bab9bf74650fff18409" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Elementos del formulario
        const selectIcono = document.getElementById('icono');
        const inputManual = document.getElementById('icono-manual');
        const previewDiv = document.getElementById('icono-preview');
        const previewImg = document.getElementById('preview-img');
        const previewText = document.getElementById('preview-text');

        // PWA Install
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('install-btn').style.display = 'inline-block'; });
        document.getElementById('install-btn').addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; document.getElementById('install-btn').style.display = 'none'; } });

        // Función para renderizar el icono en la lista
        function createLinkCard(data, docId) {
            const card = document.createElement('div');
            card.className = 'link-card';
            
            let iconElement;
            if (data.icono.includes('.') || data.icono.startsWith('http')) { // Es una imagen/URL (GitHub)
                iconElement = `<img src="${data.icono.startsWith('http') ? data.icono : GITHUB_ICONS_BASE_URL + data.icono}" class="link-icon-img" alt="Icono">`;
            } else { // Es una clase CSS (Font Awesome, Remixicon, etc.)
                iconElement = `<i class="${data.icono} link-icon"></i>`;
            }

            card.innerHTML = `
                <a href="${data.url}" target="_blank" style="display:flex; align-items:center; width:100%; text-decoration:none; color:white;">
                    ${iconElement}
                    <span class="link-text">${data.titulo}</span>
                </a>
                <button class="delete-btn" onclick="eliminarLink('${docId}')"><i class="fas fa-trash"></i></button>
            `;
            return card;
        }

        // Lógica de Links y Detección de Iconos
        onSnapshot(query(collection(db, "enlaces"), orderBy("creado", "asc")), (snapshot) => {
            const container = document.getElementById('links-container'); container.innerHTML = "";
            snapshot.forEach((docSnap) => {
                container.appendChild(createLinkCard(docSnap.data(), docSnap.id));
            });
        });

        // Lógica de aparición/desaparición del input manual y previsualización
        selectIcono.addEventListener('change', () => {
            if (selectIcono.value === 'custom') {
                inputManual.style.display = 'block';
                previewDiv.style.display = 'flex';
                updatePreview();
            } else {
                inputManual.style.display = 'none';
                previewDiv.style.display = 'none';
            }
        });

        // Función para actualizar la previsualización de la imagen de GitHub
        inputManual.addEventListener('input', updatePreview);
        
        function updatePreview() {
            const value = inputManual.value.trim();
            if (value && (value.includes('.') || value.startsWith('http'))) {
                previewText.style.display = 'none';
                previewImg.style.display = 'block';
                previewImg.src = value.startsWith('http') ? value : GITHUB_ICONS_BASE_URL + value;
            } else {
                previewImg.style.display = 'none';
                previewText.style.display = 'block';
                previewText.textContent = value || 'Previsualización aquí';
            }
        }

        window.agregarEnlace = async () => {
            const titulo = document.getElementById('titulo').value; 
            const url = document.getElementById('url').value; 
            let icono = selectIcono.value; 
            
            if (icono === 'custom') {
                icono = inputManual.value.trim();
            }
            
            if (!titulo || !url || !icono) return;
            
            await addDoc(collection(db, "enlaces"), { titulo, url, icono, creado: serverTimestamp() });
            
            // Limpiar y resetear el formulario
            document.getElementById('titulo').value = ""; 
            document.getElementById('url').value = ""; 
            selectIcono.value = "fa-brands fa-instagram"; 
            inputManual.value = "";
            inputManual.style.display = 'none';
            previewDiv.style.display = 'none'; // Ocultar preview
            
            window.toggleAdmin();
        };
        
        window.eliminarLink = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "enlaces", id)); };
        window.toggleAdmin = () => { const p = document.getElementById('admin-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        const firebaseConfig = { apiKey: "AIzaSyBqHgV4vDat1-VmZfKbiPg7nuiX-ROcexw", authDomain: "cirineo-cec21.firebaseapp.com", projectId: "cirineo-cec21", storageBucket: "cirineo-cec21.firebasestorage.app", messagingSenderId: "620210618284", appId: "1:620210618284:web:482bab9bf74650fff18409" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const MachineCard = ({ maquina, orders }) => {
            const pendingPackages = useMemo(() => {
                let pkgs = [];
                orders.forEach(o => { const incomplete = o.progreso?.filter(p => !p.finished) || []; incomplete.forEach(p => { const pieceData = o.subPiecesData?.find(sp => sp.pieza === p.piezaNombre) || o; const timePerPiece = Number(pieceData.tiempo) || 0; pkgs.push({ ...p, parentOrderId: o.id, orderCode: o.codigo, partida: o.partida, timeTotal: (p.cantidad * timePerPiece) }); }); });
                return pkgs; 
            }, [orders]);
            
            const updateObs = async (pkgId, parentOrderId, newVal) => { 
                const order = orders.find(o => o.id === parentOrderId); if(!order) return; 
                const newProgreso = order.progreso.map(p => p.id === pkgId ? {...p, observaciones: newVal} : p); 
                await db.collection('orders').doc(String(parentOrderId)).update({progreso: newProgreso}); 
            };
            
            const totalMinutesLeft = pendingPackages.reduce((sum, p) => sum + p.timeTotal, 0);
            const hoursLeft = (totalMinutesLeft / 60).toFixed(1);

            return (
                <div className="bg-[#1a1a1a] shadow-lg border border-[#333] rounded-lg p-2 flex flex-col h-full w-[300px] shrink-0">
                    <div className="flex justify-between items-center border-b border-gray-700 pb-2 mb-2">
                        <div>
                            <div className="text-[10px] text-gray-400 font-bold uppercase">MÁQUINA</div>
                            <div className="text-3xl font-black text-[#FF00FF]">#{maquina}</div>
                        </div>
                        <div className="text-right">
                            <div className="text-xs font-bold text-green-400">{hoursLeft}h</div>
                        </div>
                    </div>
                    <div className="space-y-1 overflow-y-auto flex-grow pr-1 custom-scroll" style={{maxHeight:'calc(100% - 60px)'}}>
                        {pendingPackages.length === 0 && <div className="text-center text-gray-500 text-xs py-4">Libre</div>}
                        {pendingPackages.map((p, i) => (
                            <div key={i} className="bg-[#222] p-2 rounded flex gap-2 items-center text-xs border border-gray-700">
                                <div className="font-black text-white text-lg w-6 text-right shrink-0">{p.cantidad}</div>
                                <div className="w-20 shrink-0 overflow-hidden">
                                    <div className="font-bold text-gray-300 truncate text-[10px]">{p.piezaNombre}</div>
                                    <div className="text-[9px] text-[#FF00FF] font-black truncate">{p.partida}</div>
                                </div>
                                <div className="flex-grow pl-2 border-l border-gray-600">
                                    <input className="bg-transparent w-full text-gray-300 placeholder-gray-600 outline-none" placeholder="Obs..." defaultValue={p.observaciones || ''} onBlur={(e) => updateObs(p.id, p.parentOrderId, e.target.value)}/>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [orders, setOrders] = useState([]);
            useEffect(() => { const u = db.collection('orders').onSnapshot(s => setOrders(s.docs.map(d=>d.data()))); return () => u(); }, []);

            const machineGroups = useMemo(() => { 
                const groups = {}; 
                const activeOrders = orders.filter(o => o.status !== 'ARCHIVADO');
                activeOrders.forEach(o => { if(!groups[o.maquina]) groups[o.maquina] = []; groups[o.maquina].push(o); }); 
                return Object.keys(groups).sort((a,b) => parseInt(a)-parseInt(b)).map(k => ({ id: k, orders: groups[k] })); 
            }, [orders]);

            return (
                <div className="h-full bg-[#0a0a0a] p-2">
                    <div className="flex gap-2 overflow-x-auto h-full items-stretch bottom-scroll pb-2">
                        {machineGroups.map(g => <MachineCard key={g.id} maquina={g.id} orders={g.orders} />)}
                        {machineGroups.length === 0 && <div className="text-gray-500 w-full flex items-center justify-center font-bold">No hay producción activa</div>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
