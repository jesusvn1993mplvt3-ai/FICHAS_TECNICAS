<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balta Scan Pro v18</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; background: #000; font-family: 'Roboto Condensed', sans-serif; color: white; overflow: hidden; height: 100vh; }
        
        /* --- CÁMARA Y ESCÁNER --- */
        .scanner-wrapper {
            position: relative;
            width: 100%;
            height: 45vh; /* Altura fija para la zona de cámara */
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #reader { width: 100%; height: 100%; object-fit: cover; }
        #reader video { object-fit: cover; width: 100%; height: 100%; }
        
        /* Ocultar elementos UI por defecto de la librería */
        #reader__scan_region { display: none !important; }
        #reader__dashboard_section_csr button { display: none !important; }

        /* Overlay visual de la mira */
        .scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            pointer-events: none; /* Permitir clicks a través */
            box-shadow: inset 0 0 0 40px rgba(0,0,0,0.5); /* Oscurece bordes */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scan-box {
            width: 80%;
            height: 60%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.5); /* Truco para oscurecer todo lo exterior */
        }
        /* Esquinas brillantes */
        .scan-box::before, .scan-box::after, .scan-box>:first-child::before, .scan-box>:first-child::after {
            content: ''; position: absolute; width: 30px; height: 30px;
            border-color: #3b82f6; border-style: solid; border-width: 0;
            transition: all 0.3s ease;
        }
        .scan-box::before { top: -2px; left: -2px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 20px; }
        .scan-box::after { top: -2px; right: -2px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 20px; }
        .scan-box>:first-child::before { bottom: -2px; left: -2px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 20px; }
        .scan-box>:first-child::after { bottom: -2px; right: -2px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 20px; }
        
        .scan-active .scan-box::before, .scan-active .scan-box::after, 
        .scan-active .scan-box>:first-child::before, .scan-active .scan-box>:first-child::after {
            border-color: #22c55e; /* Verde al detectar */
            transform: scale(1.1);
        }

        /* --- ESTILOS DE LA PAPELETA (Copia exacta de papeletas.html) --- */
        .label-container {
            background: white;
            color: black;
            margin-bottom: 1rem;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .label-layout {
            width: 100%;
            aspect-ratio: 6/4;
            display: flex;
            border: 1px solid #ddd;
            padding: 5px;
            box-sizing: border-box;
            background: white;
            position: relative;
        }
        .col-img { width: 25%; display: flex; align-items: center; justify-content: center; border-right: 2px solid #000; padding-right: 2px; overflow: hidden; }
        .col-img img { width: 100%; height: 100%; object-fit: contain; }
        .col-data { width: 60%; display: flex; flex-direction: column; border-right: 2px solid #000; }
        .col-barcode { width: 15%; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        .lbl-row { display: flex; border-bottom: 2px solid #000; width: 100%; }
        .lbl-row:last-child { border-bottom: none; }
        .lbl-col { border-right: 2px solid #000; padding: 1px 2px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .lbl-col:last-child { border-right: none; }
        
        .lbl-title { font-size: 8px; font-weight: 700; color: #555; text-transform: uppercase; line-height: 1; margin-bottom: 0px; }
        .lbl-big { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 20px; line-height: 0.9; color: #000; }
        .lbl-medium { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; line-height: 1; color: #000; }
        .lbl-std { font-size: 10px; font-weight: 700; color: #000; line-height: 1.1; }

        .scroll-area {
            flex-grow: 1;
            overflow-y: auto;
            background: #f1f5f9;
            padding: 10px;
            padding-bottom: 100px; /* Espacio para botones */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const firebaseConfig = { 
            apiKey: "AIzaSyCngQL1pdqghv2vbjkPycT1Xf0C46f7jYs", 
            authDomain: "cirineo-cec21.firebaseapp.com", 
            projectId: "cirineo-cec21", 
            storageBucket: "cirineo-cec21.firebasestorage.app", 
            messagingSenderId: "620210618284", 
            appId: "1:620210618284:web:482bab9bf74650fff18409" 
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- COMPONENTE VISUAL DE LA ETIQUETA ---
        // Este componente recibe la data PURA de la orden y la renderiza idéntica al generador
        const VisualLabel = ({ data, imageSources }) => {
            const svgRef = useRef(null);
            
            // Extracción de datos robusta (fallback a valores seguros)
            const modelo = data.modelo || data.codigo || 'S/N';
            const piezaRaw = data.piezaNombre || 'ESTANDAR';
            const piezaVisual = piezaRaw.split(' ')[0];
            const barcodeValue = data.codigoUnico || '0000';
            const displayPackageId = data.displayPackageId || `${data.paqueteNum}/${data.paquetesDePieza}`;
            
            // Imágenes
            const [imgSrc, setImgSrc] = useState(null);
            const [tryPng, setTryPng] = useState(false);
            const [currentSourceIdx, setCurrentSourceIdx] = useState(0);

            useEffect(() => {
                if(imageSources && imageSources.length > 0 && modelo) {
                    setCurrentSourceIdx(0);
                    setTryPng(false);
                    setImgSrc(`${imageSources[0].url}/${modelo}.jpg`);
                }
            }, [modelo, imageSources]);

            const handleImgError = () => {
                if (!tryPng) {
                    setTryPng(true);
                    if(imageSources[currentSourceIdx]) setImgSrc(`${imageSources[currentSourceIdx].url}/${modelo}.png`);
                    return;
                }
                const nextIdx = currentSourceIdx + 1;
                if (nextIdx < imageSources.length) {
                    setCurrentSourceIdx(nextIdx);
                    setTryPng(false);
                    setImgSrc(`${imageSources[nextIdx].url}/${modelo}.jpg`);
                } else setImgSrc(null);
            };

            // Barcode
            useEffect(() => {
                if (svgRef.current && barcodeValue) {
                    try {
                        JsBarcode(svgRef.current, barcodeValue, { 
                            format: "CODE128", lineColor: "#000", width: 2, height: 40, displayValue: false, margin: 0
                        });
                    } catch (e) {}
                }
            }, [barcodeValue]);

            return (
                <div className="label-container">
                    <div className="label-layout">
                        {/* FOTO */}
                        <div className="col-img">
                            {imgSrc ? <img src={imgSrc} onError={handleImgError} alt={modelo}/> : <span className="text-xs text-gray-400 font-bold text-center">SIN FOTO</span>}
                        </div>
                        {/* DATOS */}
                        <div className="col-data">
                            <div className="lbl-row" style={{height: '20%'}}>
                                <div className="lbl-col" style={{width: '60%'}}>
                                    <div className="lbl-title">MODELO</div>
                                    <div className="lbl-big" style={{fontSize: '18px'}}>{modelo}</div>
                                </div>
                                <div className="lbl-col" style={{width: '40%'}}>
                                    <div className="lbl-title">CLIENTE</div>
                                    <div className="lbl-std truncate" style={{fontSize: '9px'}}>{data.cliente || '-'}</div>
                                </div>
                            </div>
                            <div className="lbl-row" style={{height: '25%', backgroundColor: '#000', color: '#FFF'}}>
                                <div className="lbl-col" style={{width: '100%', alignItems: 'center', border: 'none'}}>
                                    <span style={{fontFamily: "'Oswald', sans-serif", fontSize: '22px', fontWeight: 'bold'}}>{piezaVisual}</span>
                                </div>
                            </div>
                            <div className="lbl-row" style={{height: '30%'}}>
                                <div className="lbl-col" style={{width: '33%', textAlign: 'center'}}>
                                    <div className="lbl-title">PAQ</div>
                                    <div className="lbl-big">{displayPackageId}</div>
                                </div>
                                <div className="lbl-col" style={{width: '33%', backgroundColor: '#eee', textAlign: 'center'}}>
                                    <div className="lbl-title">CANT</div>
                                    <div className="lbl-big">{data.cantidad}</div>
                                </div>
                                <div className="lbl-col" style={{width: '34%', textAlign: 'center', backgroundColor: '#000'}}>
                                    <div className="lbl-title" style={{color:'#ccc'}}>MAQ</div>
                                    <div className="lbl-big" style={{color:'white'}}>{data.maquina || '0'}</div>
                                </div>
                            </div>
                            <div className="lbl-row" style={{flexGrow: 1, borderBottom: 'none'}}>
                                <div className="lbl-col" style={{width: '50%'}}>
                                    <div className="lbl-title">TALLA</div>
                                    <div className="lbl-std">{data.talla || 'U'}</div>
                                </div>
                                <div className="lbl-col" style={{width: '50%'}}>
                                    <div className="lbl-title">PARTIDA</div>
                                    <div className="lbl-std">{data.partida || '-'}</div>
                                </div>
                            </div>
                        </div>
                        {/* BARCODE */}
                        <div className="col-barcode">
                             <div style={{transform: 'rotate(90deg)', width: '80px', display: 'flex', flexDirection: 'column', alignItems: 'center'}}>
                                <svg ref={svgRef} style={{width: '100%', height: 'auto'}}></svg>
                                <div style={{fontSize: '8px', fontFamily: 'monospace'}}>{barcodeValue}</div>
                             </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            // Estados de Datos
            const [kits, setKits] = useState([]);
            const [orders, setOrders] = useState([]);
            const [imageSources, setImageSources] = useState([]);
            
            // Estados de Interfaz
            const [cameraActive, setCameraActive] = useState(false);
            const [pendingData, setPendingData] = useState(null); // Si hay algo escaneado esperando confirmación
            const [scanCooldown, setScanCooldown] = useState(false); // Para evitar doble lectura
            const [flashMsg, setFlashMsg] = useState(null);
            
            const html5QrCode = useRef(null);

            // 1. CARGA INICIAL DE DATOS
            useEffect(() => {
                // Cargar Kits
                const unsubKits = db.collection('kits_produccion').onSnapshot(s => 
                    setKits(s.docs.map(d => d.data()))
                );
                // Cargar Órdenes (CRÍTICO: Aquí está la info real)
                const unsubOrders = db.collection('orders').where('status', '!=', 'ARCHIVADO').onSnapshot(s => 
                    setOrders(s.docs.map(d => ({id: d.id, ...d.data()})))
                );
                // Cargar Config Imágenes
                const unsubImg = db.collection('app_config').doc('imagenes').onSnapshot(doc => {
                    if(doc.exists) setImageSources(doc.data().sources || []);
                });
                return () => { unsubKits(); unsubOrders(); unsubImg(); };
            }, []);

            // 2. FUNCIÓN DE BÚSQUEDA CRUZADA (LA MAGIA)
            // Toma un código único y busca su objeto completo en la colección de orders
            const findFullDataForCode = (uniqueCode) => {
                for (let order of orders) {
                    if (order.progreso) {
                        const packageFound = order.progreso.find(p => p.codigoUnico === uniqueCode);
                        if (packageFound) {
                            // Encontramos el paquete, devolvemos objeto fusionado con datos de la orden
                            return {
                                ...packageFound,
                                modelo: order.codigo, // El modelo real viene de la orden
                                cliente: order.cliente,
                                partida: order.partida,
                                orderId: order.id,
                                displayPackageId: `${packageFound.paqueteNum}/${packageFound.paquetesDePieza}`
                            };
                        }
                    }
                }
                return null; // No encontrado en órdenes activas
            };

            // 3. INICIAR CÁMARA
            const startScanner = () => {
                setCameraActive(true);
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    html5QrCode.current = scanner;
                    
                    const config = { fps: 15, qrbox: { width: 250, height: 180 }, aspectRatio: 1.0 };
                    
                    scanner.start({ facingMode: "environment" }, config, (decodedText) => {
                        handleScan(decodedText.trim().toUpperCase());
                    }).catch(err => {
                        console.error("Error camara", err);
                        setFlashMsg("Error al iniciar cámara");
                    });
                }, 300);
            };

            // 4. MANEJO DEL ESCANEO
            const handleScan = (code) => {
                if (pendingData || scanCooldown) return; // Si ya hay algo en pantalla, ignorar nuevos escaneos

                setScanCooldown(true); // Bloqueo temporal

                // CASO A: ES UN KIT (Empieza con K)
                if (code.startsWith('K')) {
                    const kitDef = kits.find(k => k.kitId === code);
                    
                    if (kitDef) {
                        // RECONSTRUCCIÓN DE DATOS:
                        // No usamos los datos planos del kit, buscamos cada pieza en las órdenes reales
                        const richPieces = [];
                        let missingDataCount = 0;

                        kitDef.piezas.forEach(simplePiece => {
                            const richData = findFullDataForCode(simplePiece.codigoUnico);
                            if (richData) {
                                richPieces.push(richData);
                            } else {
                                // Si no está en orders (raro), usamos la info básica del kit
                                richPieces.push({
                                    ...simplePiece,
                                    modelo: kitDef.modelo, // Fallback
                                    displayPackageId: '?',
                                    isFallback: true
                                });
                                missingDataCount++;
                            }
                        });

                        setPendingData({
                            type: 'KIT',
                            id: code,
                            items: richPieces,
                            warning: missingDataCount > 0 ? `${missingDataCount} paquetes sin datos detallados` : null
                        });
                        playBeep();
                    } else {
                        showFlash("❌ KIT NO EXISTE");
                        setTimeout(() => setScanCooldown(false), 1500);
                    }
                } 
                // CASO B: ES PAQUETE INDIVIDUAL
                else {
                    const richData = findFullDataForCode(code);
                    if (richData) {
                        setPendingData({
                            type: 'INDV',
                            id: code,
                            items: [richData]
                        });
                        playBeep();
                    } else {
                        showFlash("❌ CÓDIGO NO ENCONTRADO EN ÓRDENES");
                        setTimeout(() => setScanCooldown(false), 2000);
                    }
                }
            };

            // 5. CONFIRMACIÓN Y SUBIDA
            const confirmAction = async () => {
                if (!pendingData) return;

                const batch = db.batch();
                const now = firebase.firestore.FieldValue.serverTimestamp();

                try {
                    pendingData.items.forEach(item => {
                        const ref = db.collection('registro_produccion').doc();
                        batch.set(ref, {
                            code: item.codigoUnico,
                            modelo: item.modelo,
                            orderId: item.orderId || 'desc',
                            partida: item.partida || 'desc',
                            paquete_indice: item.paqueteNum,
                            tejedor: "Balta Scan",
                            fecha: now,
                            kitId: pendingData.type === 'KIT' ? pendingData.id : null,
                            maquina: item.maquina || 'SN',
                            finished: false
                        });
                    });

                    await batch.commit();
                    showFlash("✅ GUARDADO EXITOSAMENTE");
                    closeModal(); // Cierra modal y reactiva escáner
                } catch (e) {
                    alert("Error al guardar: " + e.message);
                }
            };

            const closeModal = () => {
                setPendingData(null);
                // Pequeña espera para no escanear inmediatamente lo mismo si el usuario sigue apuntando
                setTimeout(() => {
                    setScanCooldown(false);
                }, 1000);
            };

            const showFlash = (text) => {
                setFlashMsg(text);
                setTimeout(() => setFlashMsg(null), 2000);
            };

            const playBeep = () => {
                // Audio feedback simple
                const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
                audio.play().catch(e=>{});
            };

            return (
                <div className="h-full flex flex-col bg-slate-900">
                    {/* --- PANTALLA INICIAL --- */}
                    {!cameraActive && (
                        <div className="flex-1 flex flex-col items-center justify-center p-6 gap-8">
                            <div className="w-48 h-48 bg-blue-900 rounded-full flex items-center justify-center animate-pulse">
                                <LucideIcon name="scan-barcode" size={80} color="white" />
                            </div>
                            <h1 className="text-4xl font-black text-white tracking-tighter">BALTA SCAN PRO</h1>
                            <button onClick={startScanner} className="w-full bg-blue-600 active:bg-blue-700 text-white py-6 rounded-2xl font-black text-2xl shadow-xl transition-transform active:scale-95">
                                ACTIVAR ESCÁNER
                            </button>
                        </div>
                    )}

                    {/* --- PANTALLA DE ESCANEO ACTIVO --- */}
                    {cameraActive && (
                        <div className="flex flex-col h-full relative">
                            {/* ZONA DE CÁMARA (ARRIBA) */}
                            <div className={`scanner-wrapper transition-all duration-300 ${pendingData ? 'h-[25vh]' : 'h-[45vh]'}`}>
                                <div id="reader"></div>
                                {/* Mira superpuesta */}
                                <div className={`scan-overlay ${pendingData ? 'hidden' : 'scan-active'}`}>
                                    <div className="scan-box"><div></div></div>
                                </div>
                                {/* Mensajes Flash */}
                                {flashMsg && (
                                    <div className="absolute inset-0 flex items-center justify-center bg-black/80 z-50">
                                        <span className="text-2xl font-bold text-white px-4 py-2 bg-slate-800 rounded border border-slate-600">{flashMsg}</span>
                                    </div>
                                )}
                            </div>

                            {/* ZONA DE RESULTADOS (ABAJO) */}
                            <div className="flex-1 bg-slate-100 rounded-t-[2rem] -mt-6 z-20 overflow-hidden flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
                                
                                {!pendingData ? (
                                    // ESTADO ESPERANDO
                                    <div className="flex-1 flex flex-col items-center justify-center text-slate-400 gap-2">
                                        <LucideIcon name="arrow-up" size={32} className="animate-bounce"/>
                                        <p className="font-bold text-sm tracking-widest uppercase">Escanea un código</p>
                                    </div>
                                ) : (
                                    // ESTADO RESULTADO ENCONTRADO
                                    <div className="flex flex-col h-full">
                                        {/* Cabecera Resultados */}
                                        <div className="bg-white p-4 border-b flex justify-between items-center shadow-sm z-10">
                                            <div>
                                                <h2 className="text-2xl font-black text-slate-800 leading-none">{pendingData.id}</h2>
                                                <p className="text-xs font-bold text-slate-500 mt-1">
                                                    {pendingData.type === 'KIT' ? 'KIT AGRUPADO' : 'PAQUETE INDIVIDUAL'}
                                                </p>
                                            </div>
                                            <div className="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-bold">
                                                {pendingData.items.length} ETIQUETAS
                                            </div>
                                        </div>

                                        {/* Lista Scrollable de Etiquetas */}
                                        <div className="scroll-area">
                                            {pendingData.warning && (
                                                <div className="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-2 mb-2 text-xs font-bold">
                                                    {pendingData.warning}
                                                </div>
                                            )}
                                            {pendingData.items.map((item, idx) => (
                                                <VisualLabel key={idx} data={item} imageSources={imageSources} />
                                            ))}
                                        </div>

                                        {/* Botones de Acción (Flotantes abajo) */}
                                        <div className="absolute bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t grid grid-cols-2 gap-3">
                                            <button onClick={closeModal} className="bg-slate-200 active:bg-slate-300 py-4 rounded-xl font-bold text-slate-600">
                                                CANCELAR
                                            </button>
                                            <button onClick={confirmAction} className="bg-blue-600 active:bg-blue-700 py-4 rounded-xl font-bold text-white shadow-lg shadow-blue-600/30">
                                                CONFIRMAR
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Icon Helper
        const LucideIcon = ({ name, size, color, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    ref.current.innerHTML = lucide.icons[name]?.toSvg({ width: size, height: size, color, class: className }) || '';
                }
            }, [name, size, color, className]);
            return <span ref={ref} className="flex items-center justify-center"></span>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
