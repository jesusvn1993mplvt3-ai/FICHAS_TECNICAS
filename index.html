<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cirineo RASTREO - Cadena de Custodia</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/jesusvn1993mplvt3-ai/CIRINEO/refs/heads/main/icon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .step-connector { flex-grow: 1; height: 3px; background: #e2e8f0; margin: 0 10px; position: relative; top: 14px; }
        .step-connector.active { background: #3b82f6; }
        .step-connector.error { background: #ef4444; }
        
        .scanner-overlay {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
        }
        
        /* Animación para incidencias */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .incident-pulse { animation: pulse-red 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- CONFIGURACIÓN FIREBASE (Misma que tus archivos actuales) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBqHgV4vDat1-VmZfKbiPg7nuiX-ROcexw",
            authDomain: "cirineo-cec21.firebaseapp.com",
            projectId: "cirineo-cec21",
            storageBucket: "cirineo-cec21.firebasestorage.app",
            messagingSenderId: "620210618284",
            appId: "1:620210618284:web:482bab9bf74650fff18409"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const Icon = ({ name, size = 18, className, color }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) ref.current.innerHTML = lucide.icons[name]?.toSvg({ width: size, height: size, class: className, stroke: color }) || '';
            }, [name, size, className, color]);
            return <span ref={ref} className="inline-flex items-center justify-center"></span>;
        };

        // --- DEFINICIÓN DE LA RUTA (Logística) ---
        const STAGES = {
            1: { id: 'TEJIDO', label: 'Tejido', icon: 'shirt', role: 'TEJEDOR' },
            2: { id: 'PREP_REC', label: 'Rx Susan', icon: 'scale', role: 'PREPARACION' },
            3: { id: 'PREP_ENT', label: 'Env Susan', icon: 'package-check', role: 'PREPARACION' },
            4: { id: 'TIN_REC', label: 'Rx Teñido', icon: 'droplets', role: 'TENIDO' }, // EL PUNTO CRITICO DE ALEX
            5: { id: 'FINAL', label: 'Terminado', icon: 'check-circle', role: 'FINAL' }
        };

        // --- COMPONENTE: TARJETA DE PAQUETE (VISUALIZACIÓN DE RUTA) ---
        const PackageRouteCard = ({ pkg, orderInfo, onClick }) => {
            // Lógica simple para determinar el paso actual basado en el historial
            // En una implementación real, esto vendría de `pkg.currentStage` en DB
            const history = pkg.tracking || [];
            const lastEvent = history[history.length - 1] || {};
            const hasIncident = history.some(h => h.type === 'INCIDENCIA');
            
            // Mapeo simple de progreso visual (0 a 5)
            let progressLevel = 0;
            if (pkg.finished) progressLevel = 1; // Tejido listo (lógica antigua)
            if (lastEvent.stage === 'PREP_REC') progressLevel = 2;
            if (lastEvent.stage === 'PREP_ENT') progressLevel = 3;
            if (lastEvent.stage === 'TIN_REC') progressLevel = 4;
            if (lastEvent.stage === 'FINAL') progressLevel = 5;

            return (
                <div onClick={onClick} className={`bg-white rounded-lg shadow-sm border-l-4 p-4 mb-3 cursor-pointer transition-all hover:shadow-md ${hasIncident ? 'border-red-500 bg-red-50' : 'border-indigo-500'}`}>
                    <div className="flex justify-between items-start mb-3">
                        <div>
                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">{orderInfo.partida}</div>
                            <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">
                                <Icon name="package" size={20}/>
                                {pkg.codigoUnico}
                            </h3>
                            <div className="text-sm text-indigo-700 font-bold">{pkg.piezaNombre} <span className="text-slate-400 font-normal">({pkg.cantidad} pzs)</span></div>
                        </div>
                        <div className="text-right">
                             {hasIncident && <div className="bg-red-600 text-white text-[10px] px-2 py-1 rounded font-bold incident-pulse mb-1">INCIDENCIA</div>}
                             <div className="text-2xl font-black text-slate-200">#{pkg.paqueteNum}</div>
                        </div>
                    </div>

                    {/* LÍNEA DE TIEMPO VISUAL */}
                    <div className="flex items-center justify-between mt-2 px-1">
                        {[1, 2, 4, 5].map((step, idx) => { // Saltamos paso 3 visualmente para ahorrar espacio en móvil
                            const isActive = progressLevel >= step;
                            const isCurrent = progressLevel === step;
                            const stageConfig = Object.values(STAGES).find(s => String(Object.keys(STAGES).indexOf(s.id)) === 'NaN'); // Simplificación
                            
                            // Mapeo manual de iconos para la vista rápida
                            const icons = ['shirt', 'scale', 'droplets', 'check-circle'];
                            const labels = ['Tejido', 'Susan', 'Teñido', 'Fin'];
                            
                            return (
                                <React.Fragment key={step}>
                                    <div className="flex flex-col items-center z-10">
                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center border-2 transition-colors ${isActive ? (hasIncident && step===4 ? 'bg-red-100 border-red-500 text-red-600' : 'bg-indigo-600 border-indigo-600 text-white') : 'bg-white border-slate-300 text-slate-300'}`}>
                                            <Icon name={icons[idx]} size={14} />
                                        </div>
                                        <span className={`text-[9px] mt-1 font-bold ${isActive ? 'text-indigo-900' : 'text-slate-300'}`}>{labels[idx]}</span>
                                    </div>
                                    {idx < 3 && (
                                        <div className={`h-1 flex-grow mx-1 rounded ${progressLevel > step ? 'bg-indigo-600' : 'bg-slate-200'}`}></div>
                                    )}
                                </React.Fragment>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- MODAL DE DETALLE E HISTORIAL ---
        const PackageDetailModal = ({ pkg, order, onClose }) => {
            if (!pkg) return null;
            const history = pkg.tracking || []; // Array de eventos [{stage, user, time, type, comment}]

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex justify-end">
                    <div className="w-full max-w-md bg-white h-full shadow-2xl flex flex-col animate-slide-in">
                        <div className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0">
                            <div>
                                <h2 className="font-bold text-xl">{pkg.codigoUnico}</h2>
                                <p className="text-xs text-slate-400 opacity-80">{order.cliente} - {order.partida}</p>
                            </div>
                            <button onClick={onClose}><Icon name="x" size={24}/></button>
                        </div>
                        
                        <div className="flex-grow overflow-y-auto p-4 bg-slate-50">
                            <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><Icon name="history"/> Historial de Custodia</h3>
                            
                            <div className="relative pl-4 border-l-2 border-slate-300 space-y-6">
                                {history.length === 0 && <div className="text-slate-400 text-sm italic">Sin movimientos registrados.</div>}
                                
                                {history.map((evt, i) => (
                                    <div key={i} className="relative">
                                        <div className={`absolute -left-[21px] top-0 w-4 h-4 rounded-full border-2 ${evt.type === 'INCIDENCIA' ? 'bg-red-500 border-red-700' : 'bg-green-500 border-green-700'}`}></div>
                                        <div className="bg-white p-3 rounded shadow-sm border border-slate-200">
                                            <div className="flex justify-between items-start">
                                                <span className="font-bold text-sm text-slate-800">{evt.stageLabel}</span>
                                                <span className="text-[10px] font-mono text-slate-500">{new Date(evt.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                            </div>
                                            <div className="text-xs text-slate-500 mt-1 flex items-center gap-1">
                                                <Icon name="user" size={10}/> {evt.user}
                                            </div>
                                            {evt.comment && (
                                                <div className={`mt-2 text-xs p-2 rounded ${evt.type === 'INCIDENCIA' ? 'bg-red-50 text-red-800 border border-red-100' : 'bg-slate-100 text-slate-600'}`}>
                                                    {evt.type === 'INCIDENCIA' && <b>⚠ REPORTE: </b>}
                                                    {evt.comment}
                                                </div>
                                            )}
                                             <div className="text-[9px] text-slate-300 mt-1 text-right">{new Date(evt.timestamp).toLocaleDateString()}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="p-4 bg-white border-t shrink-0">
                            <button onClick={onClose} className="w-full py-3 bg-slate-200 font-bold text-slate-700 rounded hover:bg-slate-300">CERRAR</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE CRÍTICO: "PROTOCOLO ALEX" (Confirmación de Recepción) ---
        const CustodyCheckModal = ({ pkgId, orderId, onConfirm, onCancel }) => {
            const [mode, setMode] = useState('decision'); // decision, incident_form
            const [comment, setComment] = useState('');
            
            const handleGreen = () => {
                onConfirm({ status: 'OK', comment: 'Recibido Completo' });
            };

            const handleRed = () => {
                setMode('incident_form');
            };

            const submitIncident = () => {
                if(comment.length < 5) return alert("Por favor describe el problema.");
                onConfirm({ status: 'INCIDENCIA', comment: comment });
            };

            return (
                <div className="fixed inset-0 z-[100] scanner-overlay flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden animate-bounce-in">
                        {mode === 'decision' && (
                            <>
                                <div className="bg-slate-900 text-white p-6 text-center">
                                    <h2 className="text-2xl font-black text-yellow-400 mb-1">RECEPCIÓN EN TEÑIDO</h2>
                                    <p className="text-sm opacity-80">¿El paquete {pkgId} está íntegro?</p>
                                </div>
                                <div className="p-6 grid grid-cols-1 gap-4">
                                    <button onClick={handleGreen} className="h-32 bg-green-600 hover:bg-green-700 rounded-lg shadow-lg flex flex-col items-center justify-center text-white transition-transform active:scale-95">
                                        <Icon name="check-circle" size={48} className="mb-2"/>
                                        <span className="text-2xl font-black">RECIBIDO COMPLETO</span>
                                        <span className="text-xs opacity-75 mt-1">Acepto responsabilidad</span>
                                    </button>
                                    
                                    <button onClick={handleRed} className="h-20 bg-red-100 hover:bg-red-200 border-2 border-red-500 rounded-lg text-red-700 font-bold flex items-center justify-center gap-2 transition-transform active:scale-95">
                                        <Icon name="alert-triangle" size={24}/>
                                        REPORTAR FALTANTE O DAÑO
                                    </button>

                                    <button onClick={onCancel} className="mt-4 text-slate-400 text-sm underline">Cancelar / Escanear otro</button>
                                </div>
                            </>
                        )}

                        {mode === 'incident_form' && (
                            <div className="p-6">
                                <h3 className="font-bold text-red-600 text-xl mb-4 flex items-center gap-2">
                                    <Icon name="file-warning"/> REPORTE DE INCIDENCIA
                                </h3>
                                <p className="text-sm text-slate-600 mb-2">Describe qué falta o qué daño tiene el paquete. Esto enviará una alerta con la hora exacta.</p>
                                <textarea 
                                    value={comment}
                                    onChange={e => setComment(e.target.value)}
                                    className="w-full border-2 border-red-200 rounded p-3 h-32 text-lg focus:border-red-500 outline-none"
                                    placeholder="Ej: Faltan 2 piezas, paquete abierto..."
                                    autoFocus
                                ></textarea>
                                <div className="flex gap-3 mt-4">
                                    <button onClick={() => setMode('decision')} className="flex-1 py-3 bg-slate-200 font-bold rounded text-slate-600">ATRÁS</button>
                                    <button onClick={submitIncident} className="flex-1 py-3 bg-red-600 text-white font-bold rounded shadow-lg animate-pulse">ENVIAR REPORTE</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- APLICACIÓN PRINCIPAL ---
        const App = () => {
            const [currentUser, setCurrentUser] = useState({ name: 'Alex', role: 'TENIDO' }); // SIMULADO - Cambiar según login real
            const [orders, setOrders] = useState([]);
            const [filter, setFilter] = useState('');
            const [selectedPkg, setSelectedPkg] = useState(null); // Para ver detalles
            
            // Estado para el flujo de escaneo activo
            const [scannedData, setScannedData] = useState(null); // { pkgId, orderId }

            // Cargar datos
            useEffect(() => {
                const unsubscribe = db.collection('orders').where('status', '!=', 'ARCHIVADO')
                    .onSnapshot(snapshot => {
                        const data = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                        setOrders(data);
                    });
                return () => unsubscribe();
            }, []);

            // Escáner Global (Teclado/Pistola)
            useEffect(() => {
                let buffer = '';
                let lastKeyTime = Date.now();

                const handleKeyDown = (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    
                    const char = e.key;
                    if (Date.now() - lastKeyTime > 100) buffer = '';
                    lastKeyTime = Date.now();

                    if (char === 'Enter') {
                        if (buffer.includes('-')) processScan(buffer);
                        buffer = '';
                    } else if (char.length === 1) {
                        buffer += char;
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [orders, currentUser]); // Dependencia crítica

            const processScan = (code) => {
                // Formato esperado: ORDERID-PKGID (ej: 1734320000-1734320001)
                const parts = code.split('-');
                if(parts.length < 2) return;
                
                const orderId = parts[0];
                const pkgIdRaw = parts[1]; // Puede venir con basura si no limpiamos
                
                // Buscar paquete en memoria (orders)
                const order = orders.find(o => String(o.id) === orderId);
                if (!order) return alert("Orden no encontrada");
                
                const pkg = order.progreso.find(p => String(p.id) === pkgIdRaw || String(p.id).includes(pkgIdRaw));
                if (!pkg) return alert("Paquete no encontrado en esta orden");

                // INICIAR FLUJO SEGÚN ROL
                if (currentUser.role === 'TENIDO') {
                    // Alex: Abre modal de decisión
                    setScannedData({ pkg, order });
                } else {
                    // Otros (Susan, Tejedor): Registro directo (simplificado para este ejemplo)
                    updatePackageStatus(pkg, order, 'OK', 'Escaneo normal');
                }
            };

            const updatePackageStatus = async (pkg, order, statusType, comment) => {
                // 1. Determinar etapa basado en rol
                let newStage = 'GENERICO';
                let stageLabel = 'Movimiento';
                
                if (currentUser.role === 'TENIDO') {
                    newStage = 'TIN_REC';
                    stageLabel = 'Recepción Teñido';
                } else if (currentUser.role === 'PREPARACION') {
                    newStage = 'PREP_REC'; 
                    stageLabel = 'Recepción Prep.';
                }
                
                // 2. Crear evento
                const newEvent = {
                    stage: newStage,
                    stageLabel: stageLabel,
                    user: currentUser.name,
                    timestamp: new Date().toISOString(),
                    type: statusType === 'INCIDENCIA' ? 'INCIDENCIA' : 'NORMAL',
                    comment: comment
                };

                // 3. Actualizar Firestore
                // Nota: Estamos modificando el array dentro del documento de la orden.
                // Lo ideal sería una subcolección, pero para mantener compatibilidad con tu código actual:
                const updatedProgreso = order.progreso.map(p => {
                    if (p.id === pkg.id) {
                        const currentHistory = p.tracking || [];
                        return { 
                            ...p, 
                            tracking: [...currentHistory, newEvent],
                            // Actualizar estado 'legacy' si es necesario
                            currentStage: newStage 
                        };
                    }
                    return p;
                });

                try {
                    await db.collection('orders').doc(String(order.id)).update({ progreso: updatedProgreso });
                    // Si es incidencia, podríamos crear un doc en colección 'alertas' separada
                    if (statusType === 'INCIDENCIA') {
                        await db.collection('incidencias').add({
                            ...newEvent,
                            orderCode: order.codigo,
                            pkgCode: pkg.codigoUnico,
                            read: false
                        });
                        alert("⚠️ REPORTE REGISTRADO CORRECTAMENTE");
                    } else {
                        // Feedback visual sutil o sonido
                        console.log("Guardado");
                    }
                } catch (e) {
                    alert("Error guardando: " + e.message);
                }
                
                setScannedData(null); // Cerrar modal
            };

            // Filtrado de paquetes para la lista
            const visiblePackages = useMemo(() => {
                let list = [];
                orders.forEach(o => {
                    if (!o.progreso) return;
                    o.progreso.forEach(p => {
                        // Filtro de texto
                        if (filter && !o.codigo.includes(filter.toUpperCase()) && !p.codigoUnico.includes(filter.toUpperCase())) return;
                        list.push({ pkg: p, order: o });
                    });
                });
                return list.sort((a,b) => b.pkg.id - a.pkg.id); // Más recientes primero
            }, [orders, filter]);

            return (
                <div className="min-h-screen pb-20">
                    {/* NAVBAR SUPERIOR */}
                    <div className="bg-slate-900 text-white p-4 sticky top-0 z-40 shadow-md">
                        <div className="flex justify-between items-center mb-2">
                            <h1 className="font-bold text-xl flex items-center gap-2 text-yellow-400">
                                <Icon name="radar"/> RASTREO
                            </h1>
                            <div className="flex items-center gap-2">
                                {/* Selector de Usuario (Simulación) */}
                                <select 
                                    className="bg-slate-800 text-xs border border-slate-600 rounded p-1"
                                    value={currentUser.role}
                                    onChange={(e) => setCurrentUser({ name: e.target.value === 'TENIDO' ? 'Alex' : 'Susan', role: e.target.value })}
                                >
                                    <option value="TEJEDOR">Tejedor</option>
                                    <option value="PREPARACION">Susan (Prep)</option>
                                    <option value="TENIDO">Alex (Teñido)</option>
                                    <option value="FINAL">Final</option>
                                </select>
                            </div>
                        </div>
                        <input 
                            type="text" 
                            placeholder="🔍 Buscar paquete, orden o partida..." 
                            className="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 outline-none"
                            value={filter}
                            onChange={e => setFilter(e.target.value)}
                        />
                    </div>

                    {/* LISTA DE PAQUETES (Timeline View) */}
                    <div className="p-4 max-w-3xl mx-auto">
                        {visiblePackages.length === 0 && (
                            <div className="text-center py-10 opacity-50">
                                <Icon name="package-search" size={48} className="mx-auto mb-2"/>
                                <p>No hay paquetes activos o coincidentes.</p>
                            </div>
                        )}
                        {visiblePackages.map(({ pkg, order }) => (
                            <PackageRouteCard 
                                key={pkg.id} 
                                pkg={pkg} 
                                orderInfo={order} 
                                onClick={() => setSelectedPkg({ pkg, order })}
                            />
                        ))}
                    </div>

                    {/* MODALES */}
                    {selectedPkg && (
                        <PackageDetailModal 
                            pkg={selectedPkg.pkg} 
                            order={selectedPkg.order} 
                            onClose={() => setSelectedPkg(null)} 
                        />
                    )}

                    {scannedData && (
                        <CustodyCheckModal 
                            pkgId={scannedData.pkg.codigoUnico}
                            orderId={scannedData.order.id}
                            onConfirm={(result) => updatePackageStatus(scannedData.pkg, scannedData.order, result.status, result.comment)}
                            onCancel={() => setScannedData(null)}
                        />
                    )}
                    
                    {/* Footer Info */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-2 text-center text-[10px] text-slate-400">
                        Usuario Actual: <b>{currentUser.name}</b> ({currentUser.role}) — Sistema Cirineo Trazabilidad
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
